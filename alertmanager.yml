global:
  resolve_timeout: 5m

route:
  receiver: operator-webhook
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # Compose replaces this local placeholder with ALERTMANAGER_WEBHOOK_URL at startup.
  # Point it at the operator's Slack bridge, PagerDuty bridge, or other webhook receiver.
  - name: operator-webhook
    webhook_configs:
      - url: http://host.docker.internal:9099/alerts
        send_resolved: true
