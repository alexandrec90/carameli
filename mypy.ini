[mypy]
python_version = 3.12
strict = false
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
plugins = pydantic.mypy

[mypy-telnyx.*]
ignore_missing_imports = true

[mypy-jambonz.*]
ignore_missing_imports = true

[mypy-arq.*]
ignore_missing_imports = true

[mypy-slowapi.*]
ignore_missing_imports = true
