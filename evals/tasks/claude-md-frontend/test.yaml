# Read-only coverage for frontend/CLAUDE.md. The "shared literals live in exactly one
# file" convention is stated there; without it the agent can't know the canonical
# location is mandated (vs just one of several places constants happen to appear).

- metadata:
    targets:
      - frontend/CLAUDE.md
  providers: [with-instructions, baseline-no-instructions]
  vars:
    prompt: >-
      In the frontend, shared literal constants must all live in exactly one file,
      never duplicated inline across hooks/components. Which file? Answer with just the
      file path, nothing else.
  threshold: 0.7
  assert:
    - type: icontains
      value: constants.ts
      weight: 3
    - type: javascript
      value: '(context.providerResponse?.metadata?.toolCalls ?? 99) <= 6'
      weight: 1
