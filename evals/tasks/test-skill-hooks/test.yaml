# End-to-end compatibility task for /test-skill. The skill activates a marker,
# relies on the workspace PreToolUse hook (never a direct artifact write), removes
# the marker, and verifies the resulting UTC timestamp.

- metadata:
    targets:
      - .claude/skills/test-skill
  providers: [with-instructions, baseline-no-instructions]
  vars:
    prompt: /test-skill
    baselinePrompt: >-
      Smoke-test the workspace PreToolUse hook without directly creating or
      editing logs/agent/test-skill-hook.txt and without running the artifact
      writer manually. Activate .claude/skills/test-skill/.active, use a second
      file-edit tool call so the hook can observe the marker, remove the marker,
      and verify that logs/agent/test-skill-hook.txt contains a fresh UTC ISO
      timestamp. Report success only when the marker is gone and the artifact is
      no more than five minutes old.
    verify: tasks/test-skill-hooks/verify.cjs
  threshold: 0.7
  assert:
    - type: javascript
      value: context.providerResponse?.metadata?.verifyPassed === true
      weight: 3
    - type: javascript
      value: '(context.providerResponse?.metadata?.toolCalls ?? 99) <= 8'
      weight: 1
