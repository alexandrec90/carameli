# Meta-task: evaluates the /triage-fixers skill end to end — the read-only triage
# layer that turns the Stop-hook profile + error ledger into a ranked "escalate to
# promptfoo" report so eval credits are spent where they matter.
#
# Flow (all inside a throwaway worktree — the real repo is never touched):
#   1. setup.cjs writes logs/agent/skills-profile.json, error-ledger.json, and the
#      optional skills-profile.optimized.json snapshot for two throwaway fixers: one
#      clearly high-priority (success 0.25, 2 recurring signatures, top output-token
#      trend + most churn) and one clearly low (all fixed, cheap, no churn).
#   2. the agent runs /triage-fixers, which should write logs/agent/triage-report.md
#      ranking fix-eval-high above fix-eval-low and citing a recurring signature.
#   3. verify.cjs confirms the report exists, ranks high above low, and cites a
#      seeded recurring signature.
#
# NOTE: not run-verified when scaffolded (an agent eval costs credits + needs the
# claude CLI). Run `npm run eval:ablate -- .claude/skills/triage-fixers` locally or in
# CI to confirm the with-instructions arm beats the baselinePrompt before trusting
# the numbers.

- metadata:
    # Ablating the skill dir makes the /triage-fixers arm fall back to the
    # baselinePrompt, so ablation measures "skill scaffolding vs unguided agent".
    targets:
      - .claude/skills/triage-fixers
  providers: [with-instructions, baseline-no-instructions]
  vars:
    prompt: /triage-fixers all
    # The stripped baseline has no /triage-fixers skill, so a bare command would
    # error. Hand the baseline the skill's plain-English job so the comparison is
    # "skill scaffolding vs an unguided agent on the same problem".
    baselinePrompt: >-
      logs/agent/skills-profile.json holds rolling per-skill agent stats (token cost
      and fix_outcomes) and logs/agent/error-ledger.json links each error signature to
      whether a later run resolved it (status open/fixed/recurring, with a last_commit
      SHA). Without editing any skill or source file, rank the fix-* skills by how much
      they'd benefit from an expensive promptfoo fixture run — weighing low success
      rate, recurring-signature count, output-token cost, and recent churn — and write
      a ranked report to logs/agent/triage-report.md. For each top skill, list the
      specific error signatures worth a fixture (recurring first) with their
      last_commit SHA. Report the top few to me. Change nothing else.
    setup: tasks/triage-fixers/setup.cjs
    verify: tasks/triage-fixers/verify.cjs
  # Correctness dominates: a run that produces the correct ranked report passes even if
  # a little inefficient. Pass = weighted score >= 0.7.
  threshold: 0.7
  assert:
    # Correctness: report exists, ranks high above low, cites a recurring sig (verify.cjs).
    - type: javascript
      value: context.providerResponse?.metadata?.verifyPassed === true
      weight: 3
    # Spiral guard — everything is in the two seeded data files (+ optional snapshot),
    # so it must not read broadly. The report Write is the single edit, so reads before
    # it == all reads. Cap at 6.
    - type: javascript
      value: '(context.providerResponse?.metadata?.readsBeforeFirstEdit ?? 99) <= 6'
      weight: 1
