# Evaluates the /fix-e2e skill end to end. setup.cjs seeds logs/e2e-failures.log with
# a structured failure (test header + fix hint + error) naming a committed routes
# fixture that has a typo'd path; the skill should fix it; verify.cjs confirms.

- metadata:
    targets:
      - .claude/skills/fix-e2e
  providers: [with-instructions, baseline-no-instructions]
  vars:
    prompt: /fix-e2e
    baselinePrompt: >-
      A Playwright E2E failure is recorded in logs/e2e-failures.log. Read that log,
      open the file named in the error, and fix the bug with the smallest edit.
    setup: tasks/fix-e2e-route-typo/setup.cjs
    verify: tasks/fix-e2e-route-typo/verify.cjs
  threshold: 0.7
  assert:
    - type: javascript
      value: context.providerResponse?.metadata?.verifyPassed === true
      weight: 3
    - type: javascript
      value: context.providerResponse?.metadata?.madeAnEdit === true
      weight: 1
    - type: javascript
      value: '(context.providerResponse?.metadata?.readsBeforeFirstEdit ?? 99) <= 6'
      weight: 1
