# Second fix-tests scenario: a failure that MATCHES a known-fixes.md row, so it
# exercises the skill's known-fix short-circuit (fix-tests-logic-bug tests the
# diagnose-from-scratch path). This is the task to pair with section-ablation of the
# "Known-fix matching" section — see section-ablate.cjs.
#
# Cheap (Haiku) tier on purpose: the whole point of the short-circuit is that the
# fix needs NO multi-step reasoning — read the log, match the pattern, apply the
# documented one-liner. If this needs Sonnet to pass, the short-circuit isn't working.

- metadata:
    # Ablating the skill dir makes the /fix-tests arm fall back to baselinePrompt,
    # so ablation measures "skill scaffolding vs unguided agent".
    targets:
      - .claude/skills/fix-tests
  providers: [with-instructions, baseline-no-instructions]
  vars:
    prompt: /fix-tests
    baselinePrompt: >-
      The test suite is failing. The failure is recorded in logs/test-failures.log.
      Read that log, find the cause in the implicated test file, and fix it with the
      smallest edit.
    setup: tasks/fix-tests-known-fix/setup.cjs
    verify: tasks/fix-tests-known-fix/verify.cjs
  threshold: 0.7
  assert:
    # Correctness: the documented fix was applied.
    - type: javascript
      value: context.providerResponse?.metadata?.verifyPassed === true
      weight: 3
    # The agent acted rather than just reporting.
    - type: javascript
      value: context.providerResponse?.metadata?.madeAnEdit === true
      weight: 1
    # Short-circuit signal: a known-fix match should reach the edit after reading
    # only the log + known-fixes.md — barely any investigation. This is where the
    # with-vs-baseline (and section-ablation) delta should show the win.
    - type: javascript
      value: '(context.providerResponse?.metadata?.readsBeforeFirstEdit ?? 99) <= 4'
      weight: 1
