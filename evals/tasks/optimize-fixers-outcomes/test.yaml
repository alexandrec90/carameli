# Meta-task: evaluates the /optimize-fixers skill's ineffective-fix escalation
# (step 3g, with the 3b success-rate gate) end to end — the analyzer that turns the
# Stop-hook ledger's `recurring_errors` into a `(recurring — needs review)` annotation
# instead of codifying yet another guess.
#
# Flow (all inside a throwaway worktree — the real repo is never touched):
#   1. setup.cjs writes logs/agent/skills-profile.json (current) and
#      skills-profile.optimized.json (snapshot) for a throwaway `fix-eval-fixture`
#      skill whose fix_outcomes.success_rate is low (0.33) and whose recurring_errors
#      lists one signature that ALREADY has a known-fixes.md row. Every other lever
#      (3a-3f) is neutralized, so 3g is the sole actionable finding.
#   2. the agent runs /optimize-fixers, which should annotate that row with
#      `(recurring — needs review)` and add NO new naive row (3b is gated off by the
#      low success rate).
#   3. verify.cjs confirms the annotation landed and no extra row was added.
#
# NOTE: not run-verified when scaffolded (an agent eval costs credits + needs the
# claude CLI). Run `npm run eval:ablate -- .claude/skills/optimize-fixers` locally or
# in CI to confirm the with-instructions arm beats the baselinePrompt before trusting
# the numbers.

- metadata:
    # Ablating the skill dir makes the /optimize-fixers arm fall back to the
    # baselinePrompt, so ablation measures "skill scaffolding vs unguided agent".
    targets:
      - .claude/skills/optimize-fixers
  providers: [with-instructions, baseline-no-instructions]
  vars:
    prompt: /optimize-fixers fix-eval-fixture
    # The stripped baseline has no /optimize-fixers skill, so a bare command would
    # error. Hand the baseline the skill's plain-English job so the comparison is
    # "skill scaffolding vs an unguided agent on the same problem".
    baselinePrompt: >-
      logs/agent/skills-profile.json holds rolling per-skill agent stats and
      logs/agent/skills-profile.optimized.json is the snapshot from the last run.
      For the skill `fix-eval-fixture`, its fix_outcomes.success_rate is low (0.33)
      and recurring_errors lists a signature that came back after being marked fixed.
      That signature already has a row in
      .claude/skills/fix-eval-fixture/known-fixes.md, so the codified fix is not
      holding. Annotate that row's Fix column with `(recurring — needs review)` and do
      NOT add a new row or overwrite the fix. Change nothing else.
    setup: tasks/optimize-fixers-outcomes/setup.cjs
    verify: tasks/optimize-fixers-outcomes/verify.cjs
  # Correctness dominates: a run that annotates the recurring row passes even if a
  # little inefficient. Pass = weighted score >= 0.7.
  threshold: 0.7
  assert:
    # Correctness: the known-fixes row was annotated and no naive row added (verify.cjs).
    - type: javascript
      value: context.providerResponse?.metadata?.verifyPassed === true
      weight: 3
    # The agent acted rather than just reporting.
    - type: javascript
      value: context.providerResponse?.metadata?.madeAnEdit === true
      weight: 1
    # Spiral guard — all data is in the seeded profile; Hard Rule 5 caps reads at 3
    # per skill (SKILL.md + known-fixes.md + profile), so it must not read broadly.
    - type: javascript
      value: '(context.providerResponse?.metadata?.readsBeforeFirstEdit ?? 99) <= 8'
      weight: 1
