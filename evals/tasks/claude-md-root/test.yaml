# Read-only coverage for the ROOT CLAUDE.md. The VanillaLand->Carameli mapping table
# lives only in CLAUDE.md (the legacy table name isn't in Carameli code), so with the
# file the agent answers instantly; ablated/baseline must dig or guess.

- metadata:
    targets:
      - CLAUDE.md
  providers: [with-instructions, baseline-no-instructions]
  vars:
    prompt: >-
      In this project's VanillaLand-to-Carameli mapping, which Carameli database table
      replaces the legacy `tblCallHistory` table? Answer with just the table name,
      nothing else.
  threshold: 0.7
  assert:
    - type: icontains
      value: call_events
      weight: 3
    - type: javascript
      value: '(context.providerResponse?.metadata?.toolCalls ?? 99) <= 6'
      weight: 1
