# Evaluates the /fix-lint skill end to end (see fix-tests-logic-bug for the template).
# setup.cjs seeds logs/lint-errors.log pointing at a committed fixture carrying an
# F401; the skill should remove the unused import; verify.cjs confirms it.

- metadata:
    targets:
      - .claude/skills/fix-lint
  vars:
    prompt: /fix-lint
    baselinePrompt: >-
      Lint errors are recorded in logs/lint-errors.log. Read that log, open the
      implicated file, and fix the reported lint violation with the smallest edit.
    setup: tasks/fix-lint-unused-import/setup.cjs
    verify: tasks/fix-lint-unused-import/verify.cjs
  threshold: 0.7
  assert:
    - type: javascript
      value: context.providerResponse?.metadata?.verifyPassed === true
      weight: 3
    - type: javascript
      value: context.providerResponse?.metadata?.madeAnEdit === true
      weight: 1
    - type: javascript
      value: '(context.providerResponse?.metadata?.readsBeforeFirstEdit ?? 99) <= 6'
      weight: 1
