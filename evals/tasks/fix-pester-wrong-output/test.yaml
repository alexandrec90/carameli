# Evaluates the /fix-pester skill end to end. setup.cjs seeds logs/pester-failures.log
# with a self-locating failure pointing at a committed .ps1 fixture that returns the
# wrong string; the skill should correct the literal; verify.cjs confirms it.

- metadata:
    targets:
      - .claude/skills/fix-pester
  vars:
    prompt: /fix-pester
    baselinePrompt: >-
      A PowerShell (Pester) test failure is recorded in logs/pester-failures.log.
      Read that log, open the implicated .ps1 file, and fix it with the smallest edit.
    setup: tasks/fix-pester-wrong-output/setup.cjs
    verify: tasks/fix-pester-wrong-output/verify.cjs
  threshold: 0.7
  assert:
    - type: javascript
      value: context.providerResponse?.metadata?.verifyPassed === true
      weight: 3
    - type: javascript
      value: context.providerResponse?.metadata?.madeAnEdit === true
      weight: 1
    - type: javascript
      value: '(context.providerResponse?.metadata?.readsBeforeFirstEdit ?? 99) <= 6'
      weight: 1
