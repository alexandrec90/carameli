# Read-only coverage for tests/CLAUDE.md. The reason the client fixture removes
# SlowAPIMiddleware (it breaks asyncpg connection sharing) is documented only in that
# file; the ablated/baseline arm must read conftest.py to find it.

- metadata:
    targets:
      - tests/CLAUDE.md
  vars:
    prompt: >-
      In this project's tests, the global `client` fixture removes one middleware
      because it breaks asyncpg connection sharing. Which middleware? Answer with just
      the middleware name, nothing else.
  threshold: 0.7
  assert:
    - type: icontains
      value: SlowAPIMiddleware
      weight: 3
    - type: javascript
      value: '(context.providerResponse?.metadata?.toolCalls ?? 99) <= 6'
      weight: 1
