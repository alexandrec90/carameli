# Carameli — instruction-file effectiveness evals.
#
# Two providers run the SAME tasks: one with the repo's instruction files, one
# with CLAUDE.md + .claude/ stripped out of the worktree. Comparing their columns
# (correctness, tool calls, failed calls, tokens, cost) is the with/without
# baseline — it shows whether the instructions actually change agent behavior.
#
# Run:   npm run eval
# View:  npm run eval:view
#
# NOTE: each test spawns a real Claude Code agent in a throwaway git worktree, so
# runs are slow and consume Claude credits. Keep the task suite small and focused.
# The worktree is taken from committed HEAD — commit instruction edits before
# evaluating, or uncommitted changes won't be measured.

description: Carameli instruction-file effectiveness

# ---- Model tiers -----------------------------------------------------------
# Two tiers; change the model strings here to switch globally.
#
#   cheap    — read-only and simple single-edit fix tasks. Currently Haiku.
#   capable  — complex bug-fix / refactor tasks that need multi-step reasoning.
#              Currently Sonnet. Tasks opt in by adding:
#                providers: [with-instructions-capable, baseline-capable]
#              to their test.yaml.
#
x-models:
  cheap-args: &cheap-args
    - '--model'
    - 'claude-haiku-4-5-20251001'
  capable-args: &capable-args
    - '--model'
    - 'claude-sonnet-4-6'

# Each task supplies its instruction as a `prompt` var; pass it straight through to
# the agent provider.
prompts:
  - '{{prompt}}'

providers:
  # Default (cheap) tier — used by all tasks unless overridden.
  - id: file://providers/claude-skill-provider.cjs
    label: with-instructions
    config:
      baseRef: HEAD
      extraArgs: *cheap-args
  - id: file://providers/claude-skill-provider.cjs
    label: baseline-no-instructions
    config:
      baseRef: HEAD
      stripInstructions: true
      extraArgs: *cheap-args

  # Capable tier — opt in per task via `providers: [with-instructions-capable, baseline-capable]`.
  - id: file://providers/claude-skill-provider.cjs
    label: with-instructions-capable
    config:
      baseRef: HEAD
      extraArgs: *capable-args
  - id: file://providers/claude-skill-provider.cjs
    label: baseline-capable
    config:
      baseRef: HEAD
      stripInstructions: true
      extraArgs: *capable-args

  # ---- Leave-one-out ablation (worked example) ------------------------------
  # To measure what ONE instruction file is worth, run the suite with just that
  # file removed and compare against `with-instructions`. The provider below
  # ablates the voip-providers rule — uncomment it and run `npm run eval` to see
  # the import-boundary task's tool-call count climb when the rule is gone.
  #
  # Leaving it commented keeps the default run cheap (extra providers multiply
  # every task's cost). For routine per-file ablation use the on-demand driver
  # instead, which scopes the run to only the tasks that target the file:
  #   npm run eval:ablate -- .claude/rules/voip-providers.md
  #   npm run eval:coverage          # which files have a test yet (free)
  #
  # - id: file://providers/claude-skill-provider.cjs
  #   label: ablate-voip-providers
  #   config:
  #     baseRef: HEAD
  #     stripPaths:
  #       - .claude/rules/voip-providers.md

# Behavioral guardrails applied to every task, on top of each task's own asserts.
# Metrics come back on the provider response; access them defensively because the
# baseline provider may legitimately spiral.
defaultTest:
  assert:
    - type: javascript
      value: '(context.providerResponse?.metadata?.failedToolCalls ?? 0) <= 2'

tests:
  - tasks/*/test.yaml
