[mutmut]
# mutmut 3 reads this section; every list is one entry per line. A comma-joined
# list is a single path that does not exist, which mutated nothing for the whole
# life of the weekly job. scripts/hooks/tests/test_weekly_summary.py checks it.
#
# The whole package is copied into mutants/ so imports resolve; only_mutate
# picks the high-risk modules (retry, HMAC, Ed25519, session) that are mutated.
source_paths =
    app
only_mutate =
    app/services/call_sync.py
    app/services/agent_status_sync.py
    app/api/webhooks/call_status.py
    app/api/webhooks/sms_inbound.py
    app/core/session.py
# Copied beside tests/ into mutants/: pytest's config and its -p plugin, and the
# migrations tests/conftest.py upgrades the test database with.
also_copy =
    pytest.ini
    scripts/pytest-plugins
    alembic
    alembic.ini
# The unit tests that exercise those modules, directly or through their routes.
# Not all of tests/unit: much of it reads repository files (compose, workflows)
# that do not exist inside mutants/. A new test of these modules belongs here;
# until it is added, the mutants it would kill show as survivors.
pytest_add_cli_args_test_selection =
    tests/unit/test_agent_status.py
    tests/unit/test_auto_attendant.py
    tests/unit/test_call_sync.py
    tests/unit/test_callback.py
    tests/unit/test_calls.py
    tests/unit/test_concurrency.py
    tests/unit/test_crm_writeback.py
    tests/unit/test_inbound_routing.py
    tests/unit/test_jambonz_engine.py
    tests/unit/test_observability.py
    tests/unit/test_outbound_call.py
    tests/unit/test_outbound_device_calls.py
    tests/unit/test_recording_download.py
    tests/unit/test_recordings.py
    tests/unit/test_retention.py
    tests/unit/test_session.py
    tests/unit/test_sms_inbound_pipeline.py
    tests/unit/test_sms_messages.py
    tests/unit/test_telnyx_carrier.py
    tests/unit/test_transcription.py
    tests/unit/test_voicemail_drop.py
    tests/unit/test_webhooks.py
# The default forks workers from the process that already ran the suite, whose
# async engine is bound to that run's event loop: the clean run failed with
# "attached to a different loop". A fork server keeps pytest out of that process.
process_isolation = forkserver
