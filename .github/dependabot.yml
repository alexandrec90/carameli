version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # Major updates intentionally remain enabled but outside the auto-merge
    # group. Dependabot opens them individually; CI tests compatibility and the
    # auto-merge workflow labels them `needs-manual-merge`. Do not add a
    # semver-major ignore here: it would freeze future compatible upgrades.
    groups:
      # Keep the test-environment stack in lockstep — vitest majors must move
      # together with happy-dom and testing-library (see known-fixes.md: the
      # vitest 2→4 upgrade left happy-dom six majors behind).
      test-env:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "happy-dom"
          - "@testing-library/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
