version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # Give fast-moving frontend ecosystems time to add peer support for a new
    # major. This delays version updates only; it never freezes them and does
    # not delay Dependabot security updates.
    cooldown:
      semver-major-days: 30
    groups:
      # TypeScript, ESLint, and their adapters publish compatibility support at
      # different times. Evaluate them as one toolchain PR instead of opening
      # several mutually incompatible majors. Keep this before the catch-all
      # minor/patch group because Dependabot assigns the first matching group.
      lint-typecheck-toolchain:
        patterns:
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "eslint-import-resolver-*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      # stylelint and its shared configs pin each other's majors: stylelint 17
      # alone conflicts with stylelint-config-standard 37, and config-standard
      # 40 alone demands stylelint 17. Evaluate them as one PR.
      stylelint-toolchain:
        patterns:
          - "stylelint"
          - "stylelint-*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      # Keep the test-environment stack in lockstep — vitest majors must move
      # together with happy-dom and testing-library (the
      # vitest 2→4 upgrade left happy-dom six majors behind).
      test-env:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "happy-dom"
          - "@testing-library/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # CI actions (actions/checkout, setup-node, …). Majors land as individual
  # PRs and are gated for manual review by the auto-merge classifier.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Base images in the Dockerfile (python:3.12-slim). Compose service images
  # (postgres, redis, …) are pinned majors chosen to match production and are
  # bumped deliberately, not by bot.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # 3.12→3.14 counts as semver-minor, so it auto-merged (PR #43) while the
      # locks are compiled --python-version 3.12 and CI runs 3.12 — and no CI
      # job builds the image. The Python runtime moves deliberately, together
      # with the locks and CI, never by bot.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
