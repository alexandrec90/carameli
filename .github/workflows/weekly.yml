name: Weekly Hardening

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

# Read-only throughout: the summary goes to the run's step summary, which needs
# no token scope.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  migration-round-trip:
    name: Migration round-trip + drift detection
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: carameli
          POSTGRES_PASSWORD: carameli_local_dev
          POSTGRES_DB: carameli
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U carameli" --health-interval=5s --health-retries=10
    env:
      DATABASE_URL: postgresql+asyncpg://carameli:carameli_local_dev@localhost:5432/carameli
      API_KEY_SECRET: weekly-test-key
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
      - run: mkdir -p reports
      # "slow and not paid": a bare -m slow would REPLACE pytest.ini's default
      # -m "not paid" (last -m wins), dropping the paid-tier exclusion for this
      # job. Re-assert it so a future paid+slow test here can never hit a live
      # provider -- no scheduled job may ever charge.
      - run: pytest tests/unit/test_migration_concerns.py -v -m "slow and not paid" --junit-xml=reports/junit-migration-weekly.xml
      - name: Upload migration result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-migration-results
          path: reports/junit-migration-weekly.xml

  resilience:
    name: Resilience and chaos
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: carameli
          POSTGRES_PASSWORD: carameli_local_dev
          POSTGRES_DB: carameli
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U carameli" --health-interval=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://carameli:carameli_local_dev@localhost:5432/carameli
      REDIS_URL: redis://localhost:6379
      API_KEY_SECRET: weekly-test-key
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
      - run: mkdir -p reports
      - name: Apply migrations
        run: alembic upgrade head
      - run: pytest tests/integration/test_resilience.py -v --junit-xml=reports/junit-resilience-weekly.xml
      - name: Upload resilience result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-resilience-results
          path: reports/junit-resilience-weekly.xml

  mutation:
    # Until 2026-10 this job had never produced a score. setup.cfg's comma-joined
    # paths read as one path that does not exist ("0 files mutated"), mutmut 3
    # ignores the `runner` key it named, and the selected tests need a database the
    # job never had. `mutmut run || true` and `continue-on-error` hid all of it, so
    # the job stayed green. Surviving mutants do not fail `mutmut run`; only a
    # broken run does, and that now turns the weekly run red, where
    # scheduled-failure-issue.yml files it.
    name: Mutation testing report
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: carameli
          POSTGRES_PASSWORD: carameli_local_dev
          POSTGRES_DB: carameli_test
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U carameli" --health-interval=5s --health-retries=10
    env:
      DATABASE_URL: postgresql+asyncpg://carameli:carameli_local_dev@localhost:5432/carameli_test
      API_KEY_SECRET: weekly-test-key
      SESSION_SECRET: weekly-session-secret
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
      - run: mkdir -p reports
      # One worker: every worker shares this one database, and tests/conftest.py
      # TRUNCATEs it per session, so parallel workers wipe each other's rows. On
      # 2026-10-25 that "killed" 65 of 965 mutants that one worker lets survive
      # (74.2% against 67.5%). One worker takes about 15 minutes.
      - name: Run mutation tests
        run: mutmut run --max-children 1
      - name: Export report
        if: always()
        run: |
          mutmut export-cicd-stats
          cp mutants/mutmut-cicd-stats.json reports/
          mutmut results > reports/mutation-survivors.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: |
            reports/mutmut-cicd-stats.json
            reports/mutation-survivors.txt

  node-pin:
    # The runtime pin is the one dependency nothing else watches. npm's floors are
    # checked on every PR by tests/unit/test_node_version_pin.py, but that only fires
    # once a package has already moved past us -- which is five months after a line goes
    # end-of-life, and arrives disguised as a broken linter. This asks the other
    # question, weekly: is the pinned line still supported, and is there a newer LTS the
    # lock already admits.
    #
    # No composite action and no lock install: the script is stdlib-only on purpose, so
    # setup-python alone is the whole environment. Its only network call is the Node
    # release schedule, and an unreachable one exits 0 rather than inventing a verdict.
    name: Node pin support window
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Check the Node pin
        run: python scripts/check-node-pin.py
      - name: Surface the finding on the run
        # A notice in a job log is a notice nobody reads. An EOL pin fails the step
        # above and the scheduled-failure sweep files it as an issue; a newer-LTS
        # proposal passes, so the step summary is where it has to land to be seen.
        if: always() && hashFiles('logs/node-pin.log') != ''
        run: |
          {
            echo "### Node pin"
            echo
            echo '```'
            cat logs/node-pin.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            case "$line" in \#*|"") continue ;; esac
            echo "::warning file=.nvmrc,line=1::$line"
          done < logs/node-pin.log

  weekly-reliability-report:
    name: Weekly reliability summary
    runs-on: ubuntu-latest
    needs: [migration-round-trip, resilience, mutation]
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: weekly-migration-results
          path: reports/migration
      - uses: actions/download-artifact@v8
        with:
          name: weekly-resilience-results
          path: reports/resilience
      # A failed mutation job may have uploaded nothing; the summary then shows
      # N/A for the score, and the run is already red.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: mutation-report
          path: reports/mutation
      # The summary builder lives in scripts/weekly_summary.py, not in a heredoc
      # here: Python inside a YAML block scalar is unlinted, untyped and
      # untestable, and this one had silently rotted (every backslash doubled, so
      # the report rendered as one line of literal \n with a permanently-zero
      # quarantine count). Stdlib-only, so no venv setup is needed in this job.
      - name: Build weekly summary
        run: |
          python3 scripts/weekly_summary.py \
            --junit reports/migration/junit-migration-weekly.xml \
            --junit reports/resilience/junit-resilience-weekly.xml \
            --quarantine-dir tests/quarantine \
            --mutation-stats reports/mutation/mutmut-cicd-stats.json \
            --mutation-survivors reports/mutation/mutation-survivors.txt \
            --out reports/weekly-summary.md
      # The run's own summary page, not an issue. This used to comment on a
      # standing "Weekly Test Reliability Report" issue that had to be held open
      # by failing the job when it was missing and reopening it when closed: a
      # permanent issue carrying a report that alerts on nothing. A failed weekly
      # run already reaches the issue list through scheduled-failure-issue.yml.
      - name: Publish summary to the run page
        run: cat reports/weekly-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload weekly summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-reliability-summary
          path: reports/weekly-summary.md
