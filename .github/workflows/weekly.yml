name: Weekly Hardening

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

# Read-only by default; the weekly-reliability-report job opts into issues:write
# for its own steps via a job-level permissions block.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  migration-round-trip:
    name: Migration round-trip + drift detection
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: carameli
          POSTGRES_PASSWORD: carameli_local_dev
          POSTGRES_DB: carameli
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U carameli" --health-interval=5s --health-retries=10
    env:
      DATABASE_URL: postgresql+asyncpg://carameli:carameli_local_dev@localhost:5432/carameli
      API_KEY_SECRET: weekly-test-key
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
      - run: mkdir -p reports
      # "slow and not paid": a bare -m slow would REPLACE pytest.ini's default
      # -m "not paid" (last -m wins), dropping the paid-tier exclusion for this
      # job. Re-assert it so a future paid+slow test here can never hit a live
      # provider -- no scheduled job may ever charge.
      - run: pytest tests/unit/test_migration_concerns.py -v -m "slow and not paid" --junit-xml=reports/junit-migration-weekly.xml
      - name: Upload migration result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-migration-results
          path: reports/junit-migration-weekly.xml

  resilience:
    name: Resilience and chaos
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: carameli
          POSTGRES_PASSWORD: carameli_local_dev
          POSTGRES_DB: carameli
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U carameli" --health-interval=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://carameli:carameli_local_dev@localhost:5432/carameli
      REDIS_URL: redis://localhost:6379
      API_KEY_SECRET: weekly-test-key
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
      - run: mkdir -p reports
      - name: Apply migrations
        run: alembic upgrade head
      - run: pytest tests/integration/test_resilience.py -v --junit-xml=reports/junit-resilience-weekly.xml
      - name: Upload resilience result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-resilience-results
          path: reports/junit-resilience-weekly.xml

  mutation:
    name: Mutation testing report
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
        with:
          extra-packages: mutmut
      - run: mkdir -p reports
      - name: Run mutation tests
        run: mutmut run || true
      - name: Export report
        run: |
          mutmut results > reports/mutation-report.txt
          echo "Mutation score:" >> reports/mutation-report.txt
          mutmut results | tail -5 >> reports/mutation-report.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation-report.txt

  weekly-reliability-report:
    name: Weekly reliability summary
    runs-on: ubuntu-latest
    needs: [migration-round-trip, resilience, mutation]
    if: always()
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: weekly-migration-results
          path: reports/migration
      - uses: actions/download-artifact@v8
        with:
          name: weekly-resilience-results
          path: reports/resilience
      - uses: actions/download-artifact@v8
        with:
          name: mutation-report
          path: reports/mutation
      # The summary builder lives in scripts/weekly_summary.py, not in a heredoc
      # here: Python inside a YAML block scalar is unlinted, untyped and
      # untestable, and this one had silently rotted (every backslash doubled, so
      # the report rendered as one line of literal \n with a permanently-zero
      # quarantine count). Stdlib-only, so no venv setup is needed in this job.
      - name: Build weekly summary
        run: |
          python3 scripts/weekly_summary.py \
            --junit reports/migration/junit-migration-weekly.xml \
            --junit reports/resilience/junit-resilience-weekly.xml \
            --quarantine-dir tests/quarantine \
            --mutation-report reports/mutation/mutation-report.txt \
            --baseline docs/evidence/performance-baselines.md \
            --out reports/weekly-summary.md
      # Fail when the pinned issue is missing. This step is the summary's only
      # delivery path, and printing a hint into a log nobody reads left the job
      # green while the report went nowhere. A red weekly run is the signal that
      # the issue needs creating -- deliberately a failure, not a new issue.
      - name: Post summary to the pinned reliability issue
        run: |
          set -euo pipefail
          issue=$(gh issue list --state open \
            --search "Weekly Test Reliability Report in:title" \
            --limit 1 --json number --jq '.[0].number')
          if [ -z "$issue" ] || [ "$issue" = "null" ]; then
            echo "::error::No open issue titled 'Weekly Test Reliability Report' was found. Create and pin one; it is the only delivery path for this summary." >&2
            exit 1
          fi
          gh issue comment "$issue" --body-file reports/weekly-summary.md
      - name: Upload weekly summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-reliability-summary
          path: reports/weekly-summary.md
