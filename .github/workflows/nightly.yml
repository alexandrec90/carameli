name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs (a manual dispatch during the scheduled run, or a slow run
# overrunning into the next night) without cancelling — a nightly full suite is
# worth letting finish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  backend-full:
    name: Full backend suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: carameli
          POSTGRES_PASSWORD: carameli_local_dev
          POSTGRES_DB: carameli
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U carameli" --health-interval=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://carameli:carameli_local_dev@localhost:5432/carameli
      REDIS_URL: redis://localhost:6379
      API_KEY_SECRET: nightly-test-key
      SESSION_SECRET: nightly-session-secret
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
      - name: Prepare reports directory
        run: mkdir -p reports
      - name: Apply migrations
        run: alembic upgrade head
      - name: Full unit suite
        run: pytest tests/unit/ -q --tb=short --junit-xml=reports/junit-unit-nightly.xml
      - name: Full integration suite
        # -m "not paid" excludes every paid tier (sandbox/chargeable/live_e2e) by
        # marker -- robust where the old -k "not sandbox" name-match was not, and
        # the guarantee that no automated pipeline ever hits a live provider.
        run: pytest tests/integration/ -q --tb=short -m "not paid" --junit-xml=reports/junit-integration-nightly.xml
      - name: Adversarial webhook tests
        run: pytest tests/unit/test_webhooks.py -q -k "403 or sig or tamper or replay"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-results
          path: reports/

  frontend-full:
    name: Full frontend suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-env
        with:
          install: "true"
      - run: mkdir -p ../reports
      - run: npm run test:run -- --reporter=junit --outputFile=../reports/junit-frontend-nightly.xml

  e2e-matrix:
    name: Cross-browser E2E
    runs-on: ubuntu-latest
    needs: [backend-full]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
      - run: playwright install --with-deps
      - name: Start backend + frontend
        # docker compose requires .env (env_file: on the app/worker services);
        # the runner has none, so seed it from the committed dev defaults.
        # .env.example ships production-only CORS_ORIGINS, but the compose
        # frontend bakes VITE_API_BASE_URL=http://localhost:8000 into the
        # bundle, so the browser calls the backend cross-origin from
        # localhost:5173 — the backend must allow that origin or every fetch is
        # CORS-blocked in all three browsers. DELETE the shipped CORS_ORIGINS
        # before appending the dev origin: leaving both lines in place relies on
        # duplicate-key "last wins", which does NOT hold across compose/dotenv
        # on the runner — the production origins won and localhost:5173 was
        # rejected (HTTP 200 with no Access-Control-Allow-Origin header).
        # Also strip COMPOSE_PROFILES=telephony (shipped enabled in .env.example)
        # so `up` starts only the app/frontend/db/redis this suite needs, not the
        # whole Jambonz/FreeSWITCH/rtpengine stack — that starved the runner and
        # produced flaky NetworkError/"Load failed" fetches before the app warmed.
        # The compose frontend service serves 5173 (it runs npm install itself
        # into a named volume — cold install is slow, hence the long wait), so
        # no host Node toolchain is needed in this job.
        # The chown hands the bind-mounted logs/ (created root-owned by the
        # containers) back to the runner user: host pytest imports app.main,
        # whose logging config opens logs/runtime/carameli.log for append and
        # dies with PermissionError otherwise. Containers run as root and keep
        # write access regardless.
        run: |
          cp .env.example .env
          sed -i '/^CORS_ORIGINS=/d; /^COMPOSE_PROFILES=/d' .env
          echo "CORS_ORIGINS=http://localhost:5173" >> .env
          docker compose up -d
          timeout 120 bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'
          sudo chown -R "$(id -u):$(id -g)" logs
          timeout 300 bash -c 'until curl -sf http://localhost:5173; do sleep 2; done'
      # Nothing in `docker compose up` creates the schema, and until the frontend
      # started calling the API from the home page an unmigrated stack looked fine:
      # /health does not touch the database, so the suite went green against a
      # backend that had no tables at all. It stopped being invisible the night the
      # comic-book home page began loading real call, SMS and extension data —
      # `POST /auth/session` grants an admin cookie without credentials, so every
      # one of those calls reached the database and raised, and the page saw only
      # "Access-Control-Allow-Origin missing" because Starlette renders an unhandled
      # exception outside CORSMiddleware.
      #
      # The customer is seeded through the app's own API rather than SQL: the
      # frontend asks for vs_customer_id 1 on every dashboard route, and a stack
      # where that 404s is not a stack these tests can call clean. Its lists are
      # empty, which is a state the UI renders without complaint.
      - name: Migrate and seed the E2E stack
        run: |
          set -euo pipefail
          docker compose exec -T app alembic upgrade head
          api_key=$(sed -n 's/^API_KEY_SECRET=//p' .env | head -n 1)
          curl -sS -f -X POST http://localhost:8000/vsapi/1.0.0/VsCustomer/Create \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${api_key}" \
            -d '{"vs_customer_id": 1}' -o /dev/null
      - name: Run cross-browser E2E
        run: pytest tests/e2e/ --browser=chromium --browser=firefox --browser=webkit -q
      # A backend fault reaches these tests only as an opaque CORS message. An
      # unhandled exception is rendered by Starlette's ServerErrorMiddleware, which
      # sits OUTSIDE CORSMiddleware, so the 500 carries no Access-Control-Allow-Origin
      # and the browser can say nothing but "header missing" — the status and the body
      # are unreadable from the page. Capture them here, on the runner, where they are
      # still readable, and keep them as an artifact rather than in scrolled-away log
      # output.
      - name: Capture backend diagnostics
        if: failure()
        run: |
          mkdir -p reports
          docker compose logs --no-color --timestamps app > reports/e2e-app.log 2>&1 || true
          docker compose logs --no-color --timestamps frontend > reports/e2e-frontend.log 2>&1 || true
          grep -E '^(CORS_ORIGINS|APP_HOST_PORT|COMPOSE_PROFILES)=' .env > reports/e2e-env.log 2>&1 || true
          for path in \
            '/health' \
            '/api/v1/extensions?vs_customer_id=1' \
            '/vsapi/1.0.0/VsCall/List/1?limit=100' \
            '/vsapi/1.0.0/VsCustomer/GetPhoneLines/1'
          do
            printf -- '--- GET %s\n' "$path" >> reports/e2e-endpoint-probe.log
            curl -sS -i -H 'Origin: http://localhost:5173' \
              "http://localhost:8000${path}" >> reports/e2e-endpoint-probe.log 2>&1 || true
            printf -- '\n\n' >> reports/e2e-endpoint-probe.log
          done
      - name: Upload backend diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          path: reports/
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
