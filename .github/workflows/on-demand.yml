name: On-Demand Lint + Test

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Branch to run against and base the fix PR on"
        required: false
        default: "master"
  # Re-run the loop automatically when an agent pushes fixes to a fix branch.
  # The bot's own auto-fix commits carry "[skip ci]" so they do not retrigger.
  push:
    branches:
      - "fix/auto-**"

permissions:
  contents: write
  pull-requests: write

jobs:
  lint-and-test:
    name: Lint + Test + Digest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: carameli
          POSTGRES_PASSWORD: carameli_local_dev
          POSTGRES_DB: carameli
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U carameli"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://carameli:carameli_local_dev@localhost:5432/carameli
      REDIS_URL: redis://localhost:6379
      API_KEY_SECRET: ci-test-key
      SESSION_SECRET: ci-session-secret

    steps:
      # On workflow_dispatch: check out the chosen base branch.
      # On push to a fix/auto-** branch: check out that same branch (default ref).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.base_branch || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci --prefix frontend

      - name: Install actionlint
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- -b /usr/local/bin 2>/dev/null || echo "actionlint install skipped"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Create working directories
        run: mkdir -p logs

      # -----------------------------------------------------------------------
      # Lint + test via the shared Python runners (CI=true selects the CI paths).
      # lint-all.py auto-fixes in place (ruff/eslint/stylelint/markdownlint) and
      # writes logs/lint-errors.log; run-tests.py runs pytest + hook + frontend
      # tests and writes logs/test-failures.log. Both filter through
      # scripts/diagnostics.py -- the same module the local VS Code tasks use, so
      # the artifacts are byte-identical across environments.
      # continue-on-error so a non-zero "failures found" exit doesn't end the job;
      # the artifact contents are the source of truth (see Detect step below).
      # -----------------------------------------------------------------------

      - name: Lint (auto-fix + report)
        env:
          CI: "true"
        run: python scripts/lint-all.py
        continue-on-error: true

      - name: Test
        env:
          CI: "true"
        run: python scripts/run-tests.py
        continue-on-error: true

      - name: Detect remaining failures
        id: digest
        run: |
          # A non-empty log means actionable failures remain. The runners' own
          # exit codes are swallowed above so a crash and a real failure can't be
          # conflated -- the committed artifact is the contract the skills read.
          if [ -s logs/lint-errors.log ] || [ -s logs/test-failures.log ] || [ -s logs/frontend-test-failures.log ]; then
            echo "failures=true" >> "$GITHUB_OUTPUT"
          else
            echo "failures=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for auto-fixed source changes
        id: autofixes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Auto-fixed files:"
            git diff --name-only
          fi

      # -----------------------------------------------------------------------
      # Upload the filtered fix artifacts (always, for debugging)
      # -----------------------------------------------------------------------

      - name: Upload fix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix-artifacts
          path: logs/

      # -----------------------------------------------------------------------
      # Commit fix branch — created when there are failures or auto-fixes.
      # logs/ is gitignored, so force-add the artifact files.
      # -----------------------------------------------------------------------

      # On a rerun (push to an existing fix/auto-** branch) commit the refreshed
      # artifacts + any new auto-fixes back to the SAME branch — no new branch, no
      # new PR. On the initial workflow_dispatch run, cut a fresh fix branch.
      # Runs on any rerun too, so a now-clean branch gets its stale logs cleared
      # (the git diff guard below no-ops when there is genuinely nothing to commit).
      - name: Commit fix branch
        if: steps.digest.outputs.failures == 'true' || steps.autofixes.outputs.has_changes == 'true' || startsWith(github.ref_name, 'fix/auto-')
        id: fix_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ "${{ github.ref_name }}" == fix/auto-* ]]; then
            BRANCH="${{ github.ref_name }}"   # rerun: stay on the existing branch
            NEW_BRANCH=false
          else
            BRANCH="fix/auto-$(date +%Y-%m-%d-%H%M)"
            git checkout -b "$BRANCH"
            NEW_BRANCH=true
          fi

          git add -u
          git add -f logs/lint-errors.log logs/test-failures.log
          # Frontend (vitest) failures are split into their own artifact; commit it
          # too when present so a local session can pick them up (the mobile fix-all
          # path skips them, since vitest can't run on a cloud session).
          if [ -f logs/frontend-test-failures.log ]; then
            git add -f logs/frontend-test-failures.log
          fi
          if ! git diff --cached --quiet; then
            git commit -m "ci: auto-fix + fix artifacts $(date +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push origin "HEAD:$BRANCH"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "new_branch=$NEW_BRANCH" >> "$GITHUB_OUTPUT"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      # Only the initial run opens a PR. Reruns update the existing one in place.
      - name: Create fix PR
        if: steps.fix_branch.outputs.committed == 'true' && steps.fix_branch.outputs.new_branch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FAILURES="${{ steps.digest.outputs.failures }}"
          AUTOFIXES="${{ steps.autofixes.outputs.has_changes }}"
          BRANCH="${{ steps.fix_branch.outputs.branch }}"

          if [ "$FAILURES" = "true" ] && [ "$AUTOFIXES" = "true" ]; then
            SUMMARY="Auto-fixes were applied and unfixable failures remain."
          elif [ "$FAILURES" = "true" ]; then
            SUMMARY="Unfixable failures remain — no auto-fixes were applied."
          else
            SUMMARY="All checks pass after auto-fix. No agent action needed — just review and merge."
          fi

          gh pr create \
            --title "fix: on-demand lint+test $(date +%Y-%m-%d)" \
            --body "$(cat <<EOF
          ## On-demand CI run — $SUMMARY

          **To fix from Claude Code (mobile or web):**
          1. Open this PR in Claude Code
          2. Run \`/fix-lint\` if \`logs/lint-errors.log\` is non-empty
          3. Run \`/fix-tests\` if \`logs/test-failures.log\` is non-empty
          4. Push fixes to this branch — CI re-runs automatically (fresh container,
             \`alembic upgrade head\` before tests) and refreshes the logs in place.
             Repeat until both logs are empty.

          **Frontend (vitest) failures** land in \`logs/frontend-test-failures.log\` and
          need a **local session** — vitest can't run on a cloud/mobile session, so
          \`/fix-all mobile\` skips them rather than spinning on something it can't verify.

          **Artifacts committed to branch \`$BRANCH\`:**
          - \`logs/lint-errors.log\` — actionable lint failures (empty = all clear)
          - \`logs/test-failures.log\` — actionable backend test failures (empty = all clear)
          - \`logs/frontend-test-failures.log\` — vitest failures, local-session only (empty = all clear)

          The same filtered logs are attached to this run as the \`fix-artifacts\` workflow artifact.
          EOF
          )" \
            --head "$BRANCH" \
            --base "${{ github.event.inputs.base_branch || 'master' }}"
