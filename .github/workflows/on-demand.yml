name: On-Demand Lint + Test

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Branch to run against and base the fix PR on"
        required: false
        default: "master"
  # Re-run automatically when fixes are pushed to a fix branch.
  push:
    branches:
      - "fix/auto-**"

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint + Test + Digest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: carameli
          POSTGRES_PASSWORD: carameli_local_dev
          POSTGRES_DB: carameli
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U carameli"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://carameli:carameli_local_dev@localhost:5432/carameli
      REDIS_URL: redis://localhost:6379
      API_KEY_SECRET: ci-test-key
      SESSION_SECRET: ci-session-secret

    steps:
      # On workflow_dispatch: check out the chosen base branch.
      # On push to a fix/auto-** branch: check out that same branch (default ref).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.base_branch || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci --prefix frontend

      - name: Install actionlint
        # Fail loudly: a silently skipped install means workflow files go
        # unchecked while the run still reports green for them. NB: the args
        # are positional ([[VERSION] DIR]) — this script does not take -b.
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- latest /usr/local/bin

      - name: Apply migrations
        run: alembic upgrade head

      - name: Create working directories
        run: mkdir -p logs

      # -----------------------------------------------------------------------
      # Lint + test via the shared Python runners (CI=true selects the CI paths).
      # lint-all.py auto-fixes in place (ruff/eslint/stylelint/markdownlint) and
      # writes logs/lint-errors.log; run-tests.py runs pytest + hook + frontend
      # tests and writes logs/test-failures.log. Both filter through
      # scripts/diagnostics.py -- the same module the local VS Code tasks use, so
      # the artifacts are byte-identical across environments.
      # continue-on-error so a non-zero "failures found" exit doesn't end the job;
      # the artifact contents are the source of truth (see Report step below).
      # -----------------------------------------------------------------------

      - name: Lint (auto-fix + report)
        env:
          CI: "true"
        run: python scripts/lint-all.py
        continue-on-error: true

      - name: Test
        env:
          CI: "true"
        run: python scripts/run-tests.py
        continue-on-error: true

      # -----------------------------------------------------------------------
      # Upload the filtered fix artifacts (always, for debugging). Logs are never
      # committed or pushed from CI — all fixing happens locally via /fix-lint and
      # /fix-tests. Download the fix-artifacts bundle to inspect a remote run.
      # -----------------------------------------------------------------------

      - name: Upload fix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix-artifacts
          path: logs/

      - name: Report remaining failures
        run: |
          # A non-empty log means actionable failures remain. The runners' own
          # exit codes are swallowed above so a crash and a real failure can't be
          # conflated -- the artifact contents are the contract. Fail the job so
          # the run shows red; fix locally, then push to re-run. Frontend (vitest)
          # failures are split into their own artifact by run-tests.py in CI, so
          # gate on that log too.
          if [ -s logs/lint-errors.log ] || [ -s logs/test-failures.log ] || [ -s logs/frontend-test-failures.log ]; then
            echo "Actionable failures remain. Download the fix-artifacts bundle,"
            echo "then run /fix-lint or /fix-tests locally."
            exit 1
          fi
          echo "All clear."
