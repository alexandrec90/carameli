name: On-Demand Lint + Test

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Branch to run against and base the fix PR on"
        required: false
        default: "master"
  # Re-run the loop automatically when an agent pushes fixes to a fix branch.
  # The bot's own auto-fix commits carry "[skip ci]" so they do not retrigger.
  push:
    branches:
      - "fix/auto-**"

permissions:
  contents: write
  pull-requests: write

jobs:
  lint-and-test:
    name: Lint + Test + Digest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: carameli
          POSTGRES_PASSWORD: carameli_local_dev
          POSTGRES_DB: carameli
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U carameli"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://carameli:carameli_local_dev@localhost:5432/carameli
      REDIS_URL: redis://localhost:6379
      API_KEY_SECRET: ci-test-key
      SESSION_SECRET: ci-session-secret

    steps:
      # On workflow_dispatch: check out the chosen base branch.
      # On push to a fix/auto-** branch: check out that same branch (default ref).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.base_branch || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci --prefix frontend

      - name: Install actionlint
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- -b /usr/local/bin 2>/dev/null || echo "actionlint install skipped"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Create working directories
        run: mkdir -p reports logs

      # -----------------------------------------------------------------------
      # Auto-fix passes (ruff --fix, eslint --fix, stylelint --fix)
      # Source file changes from these are committed to the fix branch.
      # -----------------------------------------------------------------------

      - name: ruff auto-fix
        run: |
          ruff check . --fix --unsafe-fixes --quiet 2>&1 || true
          ruff format . --quiet 2>&1 || true

      - name: eslint auto-fix
        run: npm --prefix frontend run lint:eslint -- --fix 2>&1 || true
        continue-on-error: true

      - name: stylelint auto-fix
        run: npm --prefix frontend run lint:css -- --fix 2>&1 || true
        continue-on-error: true

      - name: markdownlint auto-fix
        run: |
          npm --prefix frontend exec --yes -- \
            markdownlint "**/*.md" \
            --ignore "**/node_modules/**" --ignore "**/.git/**" --ignore "**/.venv/**" \
            -c ".markdownlint.json" --fix 2>&1 || true
        continue-on-error: true

      # -----------------------------------------------------------------------
      # Check passes — capture output + exit codes for ci-digest.py
      # Each step uses set +e so the script continues regardless of tool exit.
      # -----------------------------------------------------------------------

      - name: ruff check
        run: |
          set +e
          ruff check . --output-format=full > reports/ruff-check.txt 2>&1
          echo $? > reports/ruff-check.exit

      - name: ruff format check
        run: |
          set +e
          ruff format --check . > reports/ruff-format.txt 2>&1
          echo $? > reports/ruff-format.exit

      - name: mypy
        run: |
          set +e
          mypy app/ > reports/mypy.txt 2>&1
          echo $? > reports/mypy.exit

      - name: eslint check
        run: |
          set +e
          npm --prefix frontend run lint:eslint > reports/eslint.txt 2>&1
          echo $? > reports/eslint.exit

      - name: tsc
        run: |
          set +e
          npm --prefix frontend run lint:types > reports/tsc.txt 2>&1
          echo $? > reports/tsc.exit

      - name: stylelint check
        run: |
          set +e
          npm --prefix frontend run lint:css > reports/stylelint.txt 2>&1
          echo $? > reports/stylelint.exit

      - name: markdownlint check
        run: |
          set +e
          npm --prefix frontend exec --yes -- \
            markdownlint "**/*.md" \
            --ignore "**/node_modules/**" --ignore "**/.git/**" --ignore "**/.venv/**" \
            -c ".markdownlint.json" > reports/markdownlint.txt 2>&1
          echo $? > reports/markdownlint.exit

      - name: pip-audit
        run: |
          set +e
          pip-audit --ignore-vuln CVE-2026-4539 > reports/pip-audit.txt 2>&1
          echo $? > reports/pip-audit.exit

      - name: vulture
        run: |
          set +e
          vulture app/ --min-confidence 80 --ignore-names "cls,ctx,opts" > reports/vulture.txt 2>&1
          echo $? > reports/vulture.exit

      - name: yamllint
        run: |
          set +e
          targets=""
          for f in .pre-commit-config.yaml .github/workflows docker-compose.yml prometheus.yml; do
            [ -e "$f" ] && targets="$targets $f"
          done
          if [ -n "$targets" ]; then
            yamllint --strict -f parsable $targets > reports/yamllint.txt 2>&1
            echo $? > reports/yamllint.exit
          else
            echo "" > reports/yamllint.txt
            echo 0 > reports/yamllint.exit
          fi

      - name: actionlint
        run: |
          set +e
          if command -v actionlint > /dev/null 2>&1; then
            actionlint > reports/actionlint.txt 2>&1
            echo $? > reports/actionlint.exit
          else
            echo "" > reports/actionlint.txt
            echo 0 > reports/actionlint.exit
          fi

      - name: alembic check
        run: |
          set +e
          alembic check > reports/alembic-check.txt 2>&1
          echo $? > reports/alembic-check.exit

      # -----------------------------------------------------------------------
      # Tests
      # -----------------------------------------------------------------------

      - name: pytest
        run: |
          set +e
          pytest tests/unit/ tests/integration/test_full_flows.py tests/integration/test_contract.py \
            -v --tb=short --no-header --color=no \
            > reports/pytest.txt 2>&1
          echo $? > reports/pytest.exit

      - name: frontend tests (vitest)
        run: |
          set +e
          npm --prefix frontend run test:run > reports/frontend-tests.txt 2>&1
          echo $? > reports/frontend-tests.exit

      - name: hook tests
        run: |
          set +e
          python -m pytest scripts/hooks/tests -q --color=no > reports/hook-tests.txt 2>&1
          echo $? > reports/hook-tests.exit

      # -----------------------------------------------------------------------
      # Digest — produce logs/lint-errors.log + logs/test-failures.log
      # -----------------------------------------------------------------------

      - name: Build fix artifacts
        id: digest
        run: |
          # Don't let the digest's own exit code decide pass/fail — a crash and a
          # real failure both exit non-zero. The artifact contents are the source of
          # truth: non-empty log == actionable failures remain.
          python scripts/ci-digest.py || echo "::warning::ci-digest.py exited non-zero"
          if [ -s logs/lint-errors.log ] || [ -s logs/test-failures.log ]; then
            echo "failures=true" >> "$GITHUB_OUTPUT"
          else
            echo "failures=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for auto-fixed source changes
        id: autofixes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Auto-fixed files:"
            git diff --name-only
          fi

      # -----------------------------------------------------------------------
      # Upload raw reports as artifacts (always, for debugging)
      # -----------------------------------------------------------------------

      - name: Upload raw reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: reports/

      - name: Upload fix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix-artifacts
          path: logs/

      # -----------------------------------------------------------------------
      # Commit fix branch — created when there are failures or auto-fixes.
      # logs/ is gitignored, so force-add the artifact files.
      # -----------------------------------------------------------------------

      # On a rerun (push to an existing fix/auto-** branch) commit the refreshed
      # artifacts + any new auto-fixes back to the SAME branch — no new branch, no
      # new PR. On the initial workflow_dispatch run, cut a fresh fix branch.
      # Runs on any rerun too, so a now-clean branch gets its stale logs cleared
      # (the git diff guard below no-ops when there is genuinely nothing to commit).
      - name: Commit fix branch
        if: steps.digest.outputs.failures == 'true' || steps.autofixes.outputs.has_changes == 'true' || startsWith(github.ref_name, 'fix/auto-')
        id: fix_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ "${{ github.ref_name }}" == fix/auto-* ]]; then
            BRANCH="${{ github.ref_name }}"   # rerun: stay on the existing branch
            NEW_BRANCH=false
          else
            BRANCH="fix/auto-$(date +%Y-%m-%d-%H%M)"
            git checkout -b "$BRANCH"
            NEW_BRANCH=true
          fi

          git add -u
          git add -f logs/lint-errors.log logs/test-failures.log
          if ! git diff --cached --quiet; then
            git commit -m "ci: auto-fix + fix artifacts $(date +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push origin "HEAD:$BRANCH"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "new_branch=$NEW_BRANCH" >> "$GITHUB_OUTPUT"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      # Only the initial run opens a PR. Reruns update the existing one in place.
      - name: Create fix PR
        if: steps.fix_branch.outputs.committed == 'true' && steps.fix_branch.outputs.new_branch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FAILURES="${{ steps.digest.outputs.failures }}"
          AUTOFIXES="${{ steps.autofixes.outputs.has_changes }}"
          BRANCH="${{ steps.fix_branch.outputs.branch }}"

          if [ "$FAILURES" = "true" ] && [ "$AUTOFIXES" = "true" ]; then
            SUMMARY="Auto-fixes were applied and unfixable failures remain."
          elif [ "$FAILURES" = "true" ]; then
            SUMMARY="Unfixable failures remain — no auto-fixes were applied."
          else
            SUMMARY="All checks pass after auto-fix. No agent action needed — just review and merge."
          fi

          gh pr create \
            --title "fix: on-demand lint+test $(date +%Y-%m-%d)" \
            --body "$(cat <<EOF
          ## On-demand CI run — $SUMMARY

          **To fix from Claude Code (mobile or web):**
          1. Open this PR in Claude Code
          2. Run \`/fix-lint\` if \`logs/lint-errors.log\` is non-empty
          3. Run \`/fix-tests\` if \`logs/test-failures.log\` is non-empty
          4. Push fixes to this branch — CI re-runs automatically (fresh container,
             \`alembic upgrade head\` before tests) and refreshes the logs in place.
             Repeat until both logs are empty.

          **Artifacts committed to branch \`$BRANCH\`:**
          - \`logs/lint-errors.log\` — actionable lint failures (empty = all clear)
          - \`logs/test-failures.log\` — actionable test failures (empty = all clear)

          Raw tool outputs are available as GitHub Actions artifacts on this run.
          EOF
          )" \
            --head "$BRANCH" \
            --base "${{ github.event.inputs.base_branch || 'master' }}"
