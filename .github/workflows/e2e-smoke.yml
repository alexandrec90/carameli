name: E2E Smoke

on:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - "frontend/**"
      - "tests/e2e/**"
      - "docker-compose.yml"
      - "Dockerfile"
      - ".env.example"
      - ".github/workflows/e2e-smoke.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "app/**"
      - "frontend/**"
      - "tests/e2e/**"
      - "docker-compose.yml"
      - "Dockerfile"
      - ".env.example"
      - ".github/workflows/e2e-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Prepare CI environment file
        run: |
          cp .env.example .env
          sed -i 's|^API_KEY_SECRET=.*|API_KEY_SECRET=${{ secrets.API_KEY_SECRET }}|' .env
          sed -i 's|^ENCRYPTION_SECRET=.*|ENCRYPTION_SECRET=${{ secrets.ENCRYPTION_SECRET }}|' .env
          sed -i 's|^JAMBONZ_ACCOUNT_SID=.*|JAMBONZ_ACCOUNT_SID=${{ secrets.JAMBONZ_ACCOUNT_SID }}|' .env
          sed -i 's|^JAMBONZ_API_KEY=.*|JAMBONZ_API_KEY=${{ secrets.JAMBONZ_API_KEY }}|' .env
          sed -i 's|^JWT_SECRET=.*|JWT_SECRET=${{ secrets.JWT_SECRET }}|' .env
          sed -i 's|^TELNYX_API_KEY=.*|TELNYX_API_KEY=${{ secrets.TELNYX_API_KEY }}|' .env
          sed -i 's|^TELNYX_WEBHOOK_SECRET=.*|TELNYX_WEBHOOK_SECRET=${{ secrets.TELNYX_WEBHOOK_SECRET }}|' .env

      - name: Start backend and frontend stack
        run: docker compose up -d --build app frontend

      - name: Wait for services to become healthy
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://localhost:8000/health > /dev/null && curl -fsS http://localhost:5173 > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          exit 1

      - name: Run browser smoke tests
        run: pytest tests/e2e -v --browser chromium

      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs --no-color app frontend db pgbouncer redis

      - name: Tear down stack
        if: always()
        run: docker compose down --volumes --remove-orphans
