name: PR Gate

on:
  # Runs on every PR to master so the Dependabot auto-merge workflow has a
  # green/red signal to gate on (see dependabot-automerge.yml).
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  backend:
    name: Backend unit + integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: carameli
          POSTGRES_PASSWORD: carameli_local_dev
          POSTGRES_DB: carameli
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U carameli"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://carameli:carameli_local_dev@localhost:5432/carameli
      REDIS_URL: redis://localhost:6379
      API_KEY_SECRET: ci-test-key
      SESSION_SECRET: ci-session-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Prepare reports directory
        run: mkdir -p reports
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run backend unit tests
        run: pytest tests/unit/ -x -q --tb=short --junit-xml=reports/junit-unit.xml
      - name: Run hook and workflow script tests
        # Excluded from the app suite by pytest.ini (testpaths = tests), so run
        # explicitly — these cover scripts/ and the Dependabot workflow
        # invariants and otherwise only execute in on-demand runs.
        run: pytest scripts/hooks/tests/ -q --tb=short --junit-xml=reports/junit-hooks.xml
      - name: Run critical integration tests
        run: pytest tests/integration/test_full_flows.py tests/integration/test_contract.py -x -q --tb=short --junit-xml=reports/junit-integration.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-backend
          path: reports/

  lock-markers:
    # Dependabot rewrites requirements*.txt with bare pins, stripping the
    # environment markers the uv --universal compile emits (breaks pip install
    # on Windows dev machines). Fail fast so those rewrites can't merge.
    name: Lockfile environment markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/check-lock-markers.py

  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:run
      - name: Typecheck + production build
        # Unit tests only exercise imported modules; tsc + vite build catch
        # compile breaks anywhere in src/, which majors that auto-merge (dev
        # tooling) or wait green for review (runtime) must not slip past.
        run: npm run build
