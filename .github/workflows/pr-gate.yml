name: PR Gate

on:
  # Runs on every PR to master so the Dependabot auto-merge workflow has a
  # green/red signal to gate on (see dependabot-automerge.yml).
  pull_request:
    branches: [master]
  workflow_dispatch:

# Least privilege: every job here only reads the repo. Jobs that need more
# (none today) must opt in with their own job-level permissions block.
permissions:
  contents: read

# A new push to a PR supersedes the in-flight gate run for that PR — cancel it
# so we don't burn minutes gating a commit that's already stale. Keyed on ref,
# so the workflow_dispatch runs dependabot-lock-repair.yml fires on a bot branch
# (refs/heads/…) never collide with a PR's run (refs/pull/N/merge).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend unit + integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: carameli
          POSTGRES_PASSWORD: carameli_local_dev
          POSTGRES_DB: carameli
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U carameli"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://carameli:carameli_local_dev@localhost:5432/carameli
      REDIS_URL: redis://localhost:6379
      API_KEY_SECRET: ci-test-key
      SESSION_SECRET: ci-session-secret
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
      - name: Prepare reports directory
        run: mkdir -p reports
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run backend unit tests
        run: pytest tests/unit/ -x -q --tb=short --junit-xml=reports/junit-unit.xml
      - name: Run hook and workflow script tests
        # Excluded from the app suite by pytest.ini (testpaths = tests), so run
        # explicitly — these cover scripts/ and the Dependabot workflow
        # invariants and otherwise only execute in on-demand runs.
        run: pytest scripts/hooks/tests/ -q --tb=short --junit-xml=reports/junit-hooks.xml
      - name: Run critical integration tests
        # -m "not paid" is redundant with pytest.ini's addopts but kept explicit:
        # the PR gate must never hit a live provider even if a paid test is later
        # added to one of these files.
        # test_schema_indexes.py is fast and guards migration-only schema objects
        # (partial indexes, the pg_stat_statements extension) that create_all does
        # not build -- it lived only in the full nightly integration suite, so a
        # regression there stayed invisible until the next night. Gate it here.
        run: pytest tests/integration/test_full_flows.py tests/integration/test_contract.py tests/integration/test_schema_indexes.py -x -q --tb=short -m "not paid" --junit-xml=reports/junit-integration.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-backend
          path: reports/

  lint:
    # Owns everything the local pre-commit lint hooks used to run (ruff, mypy,
    # vulture, pip-audit, frontend linters, yamllint, actionlint, ...) via
    # scripts/lint-all.py with CI=true — the same entrypoint as the desktop
    # lint task and on-demand.yml, so local and CI can never drift.
    name: Lint
    runs-on: ubuntu-latest
    services:
      # alembic-check migrates a real database and diffs models vs migrations.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: carameli
          POSTGRES_PASSWORD: carameli_local_dev
          POSTGRES_DB: carameli
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U carameli"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://carameli:carameli_local_dev@localhost:5432/carameli
      REDIS_URL: redis://localhost:6379
      API_KEY_SECRET: ci-test-key
      SESSION_SECRET: ci-session-secret
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
      - uses: ./.github/actions/setup-node-env
        with:
          install: "true"
      - name: Install actionlint
        # Fail loudly: a silently skipped install means workflow files go
        # unchecked while the run still reports green for them. NB: the args
        # are positional ([[VERSION] DIR]) — this script does not take -b.
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- latest /usr/local/bin
      - name: Install dotenv-linter
        # Same fail-loudly rationale as actionlint.
        run: |
          curl -sSfL https://raw.githubusercontent.com/dotenv-linter/dotenv-linter/master/install.sh \
            | sh -s -- -b /usr/local/bin
      - name: Apply migrations
        run: alembic upgrade head
      - name: Lint
        env:
          CI: "true"
        run: |
          mkdir -p logs
          python scripts/lint-all.py
      - name: Report auto-fixable drift (non-blocking)
        # lint-all.py fixes in place (ruff --fix / ruff format / eslint /
        # stylelint / markdownlint) and reports only what remains. Those fixes
        # are cosmetic and are now applied on-edit by the lint-fix PostToolUse
        # hook, so residual drift is NOT a merge blocker — genuine, unfixable
        # findings already fail the "Lint" step above. Surface any drift as a
        # notice so it stays visible without spinning the gate.
        run: |
          if ! git diff --quiet; then
            echo "::warning::Auto-fixable lint drift present (cosmetic, non-blocking). Run 'python scripts/lint-all.py' locally to apply."
            git diff --stat
          fi
      - name: Upload lint artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-errors
          path: logs/lint-errors.log
          if-no-files-found: ignore

  lock-markers:
    # Dependabot rewrites requirements*.txt with bare pins, stripping the
    # environment markers the uv --universal compile emits (breaks pip install
    # on Windows dev machines). Fail fast so those rewrites can't merge.
    name: Lockfile environment markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check-lock-markers.py

  codex-sync:
    # Repository skills and .codex/hooks.json are generated from their .claude/
    # sources by scripts/sync-codex-context.py (run locally by the sync-codex
    # pre-commit hook). CI deliberately does not
    # regenerate-and-commit them: that needs write access, hides the derived
    # diff from review, and makes .claude vs the mirrors ambiguous as the source
    # of truth. It only *verifies* — regenerate on a clean checkout, then fail if
    # anything changed, which means a commit landed with the pre-commit hook
    # uninstalled or bypassed (--no-verify) and the mirrors drifted. Fast,
    # Python-only, no DB/node needed.
    name: Generated Codex context in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Regenerate Codex skills and hooks
        run: python scripts/sync-codex-context.py
      - name: Fail if generated Codex context drifted
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated Codex context is stale. Run 'python scripts/sync-codex-context.py' and commit the result, or install the hook that does it automatically: 'python scripts/install-pre-commit.py'."
            git status --porcelain
            git diff
            exit 1
          fi
      # Cross-repo: verify the vendored shared agent-harness (scripts/hooks/*, see
      # scripts/sync-devkit.py's MANIFEST) matches the shared harness repo — the
      # same single-source→committed-mirror check as above, lifted cross-repo.
      #
      # ORDER MATTERS: this checkout MUST stay *after* the mirror-drift step. It
      # lands an untracked .devkit-src/ inside the workspace, which the
      # `git status --porcelain` check above would report as drift and fail on.
      # (The previous comment here suggested checking out in "a prior step" —
      # that would have broken the mirror check the moment it was activated.)
      #
      # Pinned to a tag, never @main: one bad harness commit must not redden
      # every consuming repo at once. Bump this ref to adopt a new harness
      # release, in the same commit as the `--pull` it corresponds to.
      - name: Check out the shared harness repo
        uses: actions/checkout@v7
        with:
          repository: alexandrec90/devkit
          ref: v0.11.14
          path: .devkit-src
      - name: Vendored agent-harness in sync
        env:
          DEVKIT_DIR: ${{ github.workspace }}/.devkit-src
        run: python scripts/sync-devkit.py --check

  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-env
        with:
          install: "true"
      - run: npm run test:run
      - name: Typecheck + production build + build budgets
        # Unit tests only exercise imported modules; tsc + vite build catch
        # compile breaks anywhere in src/, which majors that auto-merge (dev
        # tooling) or wait green for review (runtime) must not slip past.
        #
        # `test:bundle` runs the build and then measures what it produced, against
        # the ratchets in `frontend/bundlePolicy.ts`. It replaces the bare `build`
        # rather than following it: the budgets need a `dist/` and fail without one,
        # so building twice would only be slower.
        run: npm run test:bundle
