name: Dependabot auto-merge

# Auto-merges Dependabot PRs once the PR Gate passes:
#   - patch/minor bumps of anything
#   - major bumps where every updated dependency is a devDependency
#     (dev tooling can only break CI, and the PR Gate just verified CI)
# Majors that touch a runtime (production or transitive) dependency are
# labelled `needs-manual-merge` and stay open for review.
#
# This repo is on a plan without branch protection, so GitHub's native
# "auto-merge" (which gates on required checks) is unavailable. Instead we
# split the work in two:
#
#   1. classify (on the PR itself) reads dependabot/fetch-metadata's
#      per-dependency JSON and labels the PR `automerge` or
#      `needs-manual-merge` per the policy above.
#   2. merge (on PR Gate completion) merges the PR — but only if PR Gate
#      succeeded on the PR's current head AND the PR carries the `automerge`
#      label.
#
# Repaired pip branches never reach the merge job here: a PR Gate run
# dispatched with GITHUB_TOKEN emits no workflow_run event (GitHub's
# recursion guard), so dependabot-lock-repair.yml watches the run it
# dispatched and merges the PR itself.
#
# If an auto-mergeable bump fails PR Gate, it simply stays open with its
# `automerge` label and no merge happens.

on:
  pull_request:
    branches: [master]
  workflow_run:
    workflows: ["PR Gate"]
    types: [completed]

# Elevated permissions are honoured for Dependabot-triggered runs when set
# explicitly here (the default token is read-only for Dependabot).
permissions:
  contents: write
  pull-requests: write

jobs:
  classify:
    name: Label by update type
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Label by bump type and dependency scope
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATED_DEPS_JSON: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail
          # Automerge only when every updated dependency is a patch/minor, or
          # a major confined to devDependencies. Unknown update types fall
          # through to manual review.
          label=$(jq -r '
            if length > 0 and all(.[];
                .updateType == "version-update:semver-patch" or
                .updateType == "version-update:semver-minor" or
                (.updateType == "version-update:semver-major" and
                 .dependencyType == "direct:development"))
            then "automerge"
            else "needs-manual-merge"
            end' <<<"$UPDATED_DEPS_JSON")
          gh pr edit "$PR_URL" --add-label "$label"

  merge:
    name: Merge if PR Gate passed
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Merge auto-mergeable PR for this branch
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open \
            --json number,labels,author,headRefOid --jq '.[0]')
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "No open PR for branch '$HEAD_BRANCH'; nothing to merge."
            exit 0
          fi
          number=$(echo "$pr" | jq -r '.number')
          author=$(echo "$pr" | jq -r '.author.login')
          head_sha=$(echo "$pr" | jq -r '.headRefOid')
          if [ "$author" != "app/dependabot" ]; then
            echo "PR #$number is not authored by Dependabot; refusing to merge."
            exit 1
          fi
          if [ "$head_sha" != "$RUN_HEAD_SHA" ]; then
            echo "PR #$number moved past the gated commit $RUN_HEAD_SHA; the newer head's own PR Gate run owns it."
            exit 0
          fi
          has_automerge=$(echo "$pr" | jq -r '[.labels[].name] | index("automerge") // empty')
          if [ -z "$has_automerge" ]; then
            echo "PR #$number is not labelled 'automerge' (likely a runtime major); leaving for manual review."
            exit 0
          fi
          echo "PR Gate passed and PR #$number is auto-mergeable; merging."
          gh pr merge "$number" --repo "$REPO" --merge
