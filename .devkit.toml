# Per-project config for the vendored devkit hook scripts (scripts/hooks/*.py).
# The scripts are byte-identical across projects; everything project-specific lives
# here. Loaded by scripts/hooks/harness_config.py. Schema + neutral defaults: that
# module's dataclasses.
#
# Deliberately NOT in sync-devkit.py's MANIFEST -- this is the per-project seam, so
# editing it is correct and is never reported as drift.

[project]
# Prefix for harness control env vars:
#   CARAMELI_SKIP_STOP_VERIFY, CARAMELI_STOP_TESTS_AUTOSTART
env_prefix = "CARAMELI"

[paths]
app = "app/"
tests = "tests/"
unit_tests = "tests/unit"

# The PreToolUse Bash output cap. `enforce-capped-bash.py` blocks an uncapped Bash
# call and quotes `max_bytes` in the reason; `invoke-capped.py` applies it. One field
# feeds both, so the number the agent is told to use is the number it gets.
[bash]
max_bytes = 4000
head_bytes = 2000

# Tier 2b: host pytest against db+redis over their published compose ports.
[db]
enabled = true
services = ["db", "redis"]
db_service = "db"
db_port = 5432
redis_service = "redis"
redis_port = 6379
# Mirror docker-compose.yml's POSTGRES_* and CI's env block.
user = "carameli"
password = "carameli_local_dev" # pragma: allowlist secret
# NOT "carameli": the test session TRUNCATEs every table in whatever it is pointed at,
# and the compose `carameli` database is the one holding the provisioned customer,
# extension and DID rows this laptop's stack runs on. `tests/conftest.py` now refuses
# a target nobody marked disposable; this makes the disposable one the default rather
# than something each caller has to remember.
name = "carameli_test"
url_scheme = "postgresql+asyncpg"
url_env = ["DATABASE_URL", "DIRECT_DATABASE_URL"]
redis_env = "REDIS_URL"

# Extra env for host pytest: name -> default (an already-set os.environ wins).
[db.test_env]
API_KEY_SECRET = "ci-test-key" # pragma: allowlist secret
SESSION_SECRET = "ci-session-secret" # pragma: allowlist secret

# Tier 3: vitest (frontend/src changed) + typecheck (skin files changed).
[frontend]
enabled = true
dir = "frontend"
src = "frontend/src/"
skin = "frontend/src/skins"
test_cmd = ["run", "test:run"]
# `lint:types`, not `typecheck` — this project has no script by that name, so the tier
# was spending an npm invocation to print "Missing script" on every skin change.
typecheck_cmd = ["run", "lint:types"]

# The interpreter a box is provisioned with. Without it `worktree.py` falls back to
# reading the `FROM python:` tag in Dockerfile and says so on every spawn; the fallback
# is right, but a box that silently guesses its Python is a box whose first third-party
# import can fail for a reason that reads as a broken branch.
[python]
version = "3.12"
