# Per-project config for the vendored devkit hook scripts (scripts/hooks/*.py).
# The scripts are byte-identical across projects; everything project-specific lives
# here. Loaded by scripts/hooks/harness_config.py. Schema + neutral defaults: that
# module's dataclasses.
#
# Deliberately NOT in sync-devkit.py's MANIFEST -- this is the per-project seam, so
# editing it is correct and is never reported as drift.

[project]
# Prefix for harness control env vars:
#   CARAMELI_SKIP_STOP_VERIFY, CARAMELI_STOP_TESTS_AUTOSTART
env_prefix = "CARAMELI"

[paths]
app = "app/"
tests = "tests/"
unit_tests = "tests/unit"

# The PreToolUse Bash output cap. `enforce-capped-bash.py` blocks an uncapped Bash
# call and quotes `max_bytes` in the reason; `invoke-capped.py` applies it. One field
# feeds both, so the number the agent is told to use is the number it gets.
[bash]
max_bytes = 4000
head_bytes = 2000

# Tier 2b: host pytest against db+redis over their published compose ports.
[db]
enabled = true
services = ["db", "redis"]
db_service = "db"
db_port = 5432
redis_service = "redis"
redis_port = 6379
# Mirror docker-compose.yml's POSTGRES_* and CI's env block.
user = "carameli"
password = "carameli_local_dev" # pragma: allowlist secret
# NOT "carameli": the test session TRUNCATEs every table in whatever it is pointed at,
# and the compose `carameli` database is the one holding the provisioned customer,
# extension and DID rows this laptop's stack runs on. `tests/conftest.py` now refuses
# a target nobody marked disposable; this makes the disposable one the default rather
# than something each caller has to remember.
name = "carameli_test"
url_scheme = "postgresql+asyncpg"
url_env = ["DATABASE_URL", "DIRECT_DATABASE_URL"]
redis_env = "REDIS_URL"

# Extra env for host pytest: name -> default (an already-set os.environ wins).
[db.test_env]
API_KEY_SECRET = "ci-test-key" # pragma: allowlist secret
SESSION_SECRET = "ci-session-secret" # pragma: allowlist secret

# Tier 3: vitest (frontend/src changed) + typecheck (skin files changed).
[frontend]
enabled = true
dir = "frontend"
src = "frontend/src/"
skin = "frontend/src/skins"
test_cmd = ["run", "test:run"]
# `lint:types`, not `typecheck` — this project has no script by that name, so the tier
# was spending an npm invocation to print "Missing script" on every skin change.
typecheck_cmd = ["run", "lint:types"]

# `.env` values a box has to derive from its own port lease.
#
# Seeding copies this checkout's `.env` verbatim and then appends a managed block, and
# compose's dotenv parser takes the last assignment of a duplicated key -- so a key named
# here overrides the seeded line without editing it. `${NAME}` expands against the env
# devkit writes into that block: `COMPOSE_PROJECT_NAME` plus one `<SERVICE>_HOST_PORT`
# per service in the port registry.
#
# CORS_ORIGINS is the whole reason this table exists. A box publishes its frontend on its
# own port, but the seeded `CORS_ORIGINS` still names whatever this checkout's `.env`
# says -- and this one says `*`, which `app/main.py` refuses (the CORS spec forbids a
# wildcard alongside `allow_credentials=True`) and replaces with `DEFAULT_FRONTEND_ORIGIN`,
# the primary's `http://localhost:5173`. The box's app then rejects every request the
# box's own frontend makes. It surfaces as a console full of preflight failures against
# `/vg/1.0.0/frontend-logs`, which reads as an application bug rather than as a box that
# was provisioned half-configured.
[worktree.env]
CORS_ORIGINS = "http://localhost:${FRONTEND_HOST_PORT}"

# Tier 4: the nightly stop-idle pass may stop this stack.
#
# Opted in because this stack is the machine's largest background cost, not because
# leaving it up is untidy. Measured 2026-08-21: with app, worker and frontend up,
# `com.docker.backend.exe` on the Windows side burned 255% of one core -- and 209%
# within 229 seconds of a cold start, so it is not a slow leak. The profile is ~550
# ioctls/s moving 21 KB/s, about 39 bytes an operation: the three containers bind-mount
# Windows paths and their reloaders stat those trees continuously across the 9p bridge.
# Stopping them took it to 11.2%. Restarting Docker does not help, and `.wslconfig`'s
# `processors=4` caps the WSL VM rather than that Windows process, so nothing already
# in place bounded it.
#
# The guard in devkit's `keep_reason` is what makes this safe rather than a database
# stopped out from under someone: it skips the stack while any of its ports carries an
# established connection, skips it for the first two hours after start, and keeps it up
# on any ambiguity at all -- an unreadable netstat or an unparseable start time. And it
# is `docker stop`, never `down`, so named volumes and the containers themselves
# survive; "Docker: Start Stack" brings it back.
[docker]
auto_stop = true

# The cheap preview: `worktree.py preview <ref> --ui` (or the "Preview: Open a UI
# Branch (Frontend Only)" task) starts only these services in the preview box and
# borrows everything else from this checkout's already-running stack on its pinned
# ports. ui_env lands in the box's .env after the port variables, so the compose
# frontend service picks it up: the empty base URL sends the browser through the
# Vite dev proxy (same origin — the app's CORS allow-list never has to name the
# box's port), and the proxy reaches the donor app across the host bridge because
# a `--no-deps` box has no `app` container. `${APP_HOST_PORT}` here expands to the
# DONOR's app port, not the box's — that is the point.
[worktree]
ui_services = ["frontend"]

[worktree.ui_env]
VITE_API_BASE_URL = ""
VITE_PROXY_TARGET = "http://host.docker.internal:${APP_HOST_PORT}"
