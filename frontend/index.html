<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1A0F00" />
  <!-- Both spellings: the `apple-` one is what iOS Safari reads, the bare one is the
       standard every other engine reads — and Chrome warns on every load about the
       `apple-` one alone, which is the other message filling the console. -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <!-- Icons are generated from assets-src/comic-book/monogram.png — the CM mark, not the
       CARAMELI wordmark, which is illegible below about 48px. -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <title>Carameli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lobster&family=Outfit:wght@400;500;700;800&display=swap"
    rel="stylesheet" />
  <!--
    Comic-book's panel art and lettering fonts, fetched only by the skin that draws
    them. As static tags in here they were fetched by all four skins: on `barebone` a
    reload pulled 1.94 MB of panel art the page never painted, plus a render-blocking
    stylesheet for three fonts nothing used.

    The stored skin is readable synchronously, so the guard costs microseconds and the
    art on the skin that wants it still starts downloading here in <head>, before the
    entry module is fetched — the fonts included, because comic-book's *loading* screen
    is set in Bangers before its chunk has even been fetched.

    SKINS and DEFAULT must match `src/skins/registry.ts`, and PANELS must match the
    images `editor/layoutConfig.ts` draws. Both agreements are asserted by
    `assetPolicy.test.ts` rather than left to whoever edits one of them next.
  -->
  <script>
    (function () {
      var SKINS = ['carameli', 'candy-shop', 'barebone', 'comic-book'];
      var DEFAULT = 'comic-book';
      // One list per page, because the first paint draws only one page's panels:
      // preloading both sets would put the other page's art on this page's critical
      // path. The keys and the route split mirror pageForPath in
      // `src/skins/comic-book/panels.ts`.
      var PANELS = {
        classic: [
          '/comic-book/logo.webp',
          '/comic-book/switchboard.webp',
          '/comic-book/mailman1.webp',
          '/comic-book/mechanic.webp',
          '/comic-book/receptionist.webp',
          '/comic-book/rolodex.webp',
          '/comic-book/rotary%20phone.webp',
          '/comic-book/mailman2.webp',
        ],
        home: [
          '/comic-book/logo2.webp',
          '/comic-book/push-button-phone.webp',
          '/comic-book/hand-notepad.webp',
          '/comic-book/conversation.webp',
          '/comic-book/pensive-woman.webp',
        ],
      };
      var FONTS =
        'https://fonts.googleapis.com/css2?family=Bangers&family=Boogaloo&family=Permanent+Marker&display=swap';

      var stored = null;
      // Safari in private mode throws on localStorage rather than returning null.
      try { stored = localStorage.getItem('skin'); } catch (e) { stored = null; }
      if (SKINS.indexOf(stored) === -1) stored = DEFAULT;
      if (stored !== 'comic-book') return;

      // Fetched with an Image rather than a link preload. Both issue the same
      // request at the same moment, but a preload has to be *claimed* by a consumer
      // within about three seconds of the load event or Chrome prints "was preloaded
      // using link preload but not used within a few seconds from the window's load
      // event" — once per file, on every reload. The consumer is the <img> the
      // comic-book chunk renders, and in dev that chunk is still arriving module by
      // module when the load event fires, so the page drew the art a second or two
      // after the browser had given up on it. An Image is its own consumer, so there
      // is nothing left to claim, and holding the objects keeps the bytes in the
      // memory cache for the <img> that follows.
      // The asset policy proves this list matches the pictures the page draws and
      // that every file exists, so no runtime audit has to ship to each visitor.
      var list = PANELS[location.pathname === '/' ? 'home' : 'classic'];
      window.__carameliArt = [];
      for (var i = 0; i < list.length; i++) {
        var image = new Image();
        image.src = list[i];
        window.__carameliArt.push(image);
      }

      var fonts = document.createElement('link');
      fonts.rel = 'stylesheet';
      fonts.href = FONTS;
      document.head.appendChild(fonts);
    })();
  </script>
</head>

<body>
  <!-- Set background before React boots so there's no white flash during JS load -->
  <script>
    (function () {
      var backgrounds = {
        'carameli': '#1A0F00', 'candy-shop': '#1A0F00',
        'barebone': '#ffffff', 'comic-book': '#FAFAF2',
      };
      var skin = localStorage.getItem('skin') || 'comic-book';
      document.body.style.background = backgrounds[skin] || '#FFE033';
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
