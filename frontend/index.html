<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1A0F00" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <!-- Icons are generated from assets-src/comic-book/monogram.png — the CM mark, not the
       CARAMELI wordmark, which is illegible below about 48px. -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <title>Carameli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lobster&family=Outfit:wght@400;500;700;800&display=swap"
    rel="stylesheet" />
  <!--
    Comic-book's panel art and lettering fonts, fetched only by the skin that draws
    them. As static tags in here they were fetched by all four skins: on `barebone` a
    reload pulled 1.94 MB of panel art the page never painted, plus a render-blocking
    stylesheet for three fonts nothing used.

    The stored skin is readable synchronously, so the guard costs microseconds and the
    preload scanner still sees the tags on the skin that wants them — the fonts
    included, because comic-book's *loading* screen is set in Bangers before its chunk
    has even been fetched.

    SKINS and DEFAULT must match `src/skins/registry.ts`, and PANELS must match the
    images `editor/layoutConfig.ts` draws. Both agreements are asserted by
    `assetPolicy.test.ts` rather than left to whoever edits one of them next.
  -->
  <script>
    (function () {
      var SKINS = ['carameli', 'candy-shop', 'barebone', 'comic-book'];
      var DEFAULT = 'comic-book';
      // One list per page, because the first paint draws only one page's panels:
      // preloading both sets would put the other page's art on this page's critical
      // path. The keys and the route split mirror pageForPath in
      // `src/skins/comic-book/panels.ts`.
      var PANELS = {
        classic: [
          '/comic-book/logo.webp',
          '/comic-book/switchboard.webp',
          '/comic-book/mailman1.webp',
          '/comic-book/mechanic.webp',
          '/comic-book/receptionist.webp',
          '/comic-book/rolodex.webp',
          '/comic-book/rotary%20phone.webp',
          '/comic-book/mailman2.webp',
        ],
        home: [
          '/comic-book/logo2.webp',
          '/comic-book/notepad.webp',
          '/comic-book/push-button-phone.webp',
          '/comic-book/man-woman-talking.webp',
        ],
      };
      var FONTS =
        'https://fonts.googleapis.com/css2?family=Bangers&family=Boogaloo&family=Permanent+Marker&display=swap';

      var stored = null;
      // Safari in private mode throws on localStorage rather than returning null.
      try { stored = localStorage.getItem('skin'); } catch (e) { stored = null; }
      if (SKINS.indexOf(stored) === -1) stored = DEFAULT;
      if (stored !== 'comic-book') return;

      var list = PANELS[location.pathname === '/' ? 'home' : 'classic'];
      for (var i = 0; i < list.length; i++) {
        var preload = document.createElement('link');
        preload.rel = 'preload';
        preload.as = 'image';
        preload.href = list[i];
        document.head.appendChild(preload);
      }

      var fonts = document.createElement('link');
      fonts.rel = 'stylesheet';
      fonts.href = FONTS;
      document.head.appendChild(fonts);
    })();
  </script>
</head>

<body>
  <!-- Set background before React boots so there's no white flash during JS load -->
  <script>
    (function () {
      var backgrounds = {
        'carameli': '#1A0F00', 'candy-shop': '#1A0F00',
        'barebone': '#ffffff', 'comic-book': '#FAFAF2',
      };
      var skin = localStorage.getItem('skin') || 'comic-book';
      document.body.style.background = backgrounds[skin] || '#FFE033';
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
