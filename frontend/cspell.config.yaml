  - jambonz
  - kwarg
  - mypy
  - payg
  - pytest
  - rtpengine
  - smsws
  - unposted
  # Three.js / R3F / 3D rendering terms
  - drei
  - glsl
  - lerp
  - metalness
  - clearcoat
  - envmap
  - mipmap
  - vignette
  - subsurface
  - shadermaterial
  - buffergeometry
