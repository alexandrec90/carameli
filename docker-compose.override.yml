services:
  # Per-service memory ceilings so no single dev container can balloon and
  # starve the host. Tuned for a memory-constrained laptop; the WSL2 VM as a
  # whole is also capped in ~/.wslconfig. Bump a value if a container OOMs
  # (check `docker inspect <name> --format '{{.State.OOMKilled}}'`).
  db:
    mem_limit: 512m
  pgbouncer:
    mem_limit: 128m
  db-backup:
    mem_limit: 128m
  app:
    mem_limit: 768m
  worker:
    mem_limit: 512m
  frontend:
    mem_limit: 1g
  redis:
    mem_limit: 256m
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
  minio:
    mem_limit: 512m

  # Telephony + monitoring profiles: opt-in, on-demand only. `restart: "no"`
  # overrides the base compose's `unless-stopped` so these NEVER rejoin the
  # auto-boot herd when Docker Desktop starts — profiles gate `up`, but the
  # restart policy is what the daemon honors on boot. Spin them up deliberately
  # (`docker compose --profile telephony up -d`, `--profile monitoring`) and
  # they stay down again after the next Docker Desktop restart.
  # mem_limits are kept so an occasional session can't blow past the VM cap.
  influxdb:
    restart: "no"
    mem_limit: 512m
  jambonz-db:
    restart: "no"
    mem_limit: 512m
  freeswitch:
    restart: "no"
    mem_limit: 1g
  rtpengine:
    restart: "no"
    mem_limit: 256m
  jambonz:
    restart: "no"
    mem_limit: 768m

  # Monitoring profile (--profile monitoring). Opt-in like telephony above.
  otel-collector:
    restart: "no"
  prometheus:
    restart: "no"
  alertmanager:
    restart: "no"
  grafana:
    restart: "no"
  uptime-kuma:
    restart: "no"
