# What `scripts/e2e.py` lays over docker-compose.yml for the local end-to-end tier. The
# script runs it as its own Compose project, which it creates and deletes, so the tier
# shares no container, port or volume with the stack someone may be working in.
#
# `env_file` is reset because the checkout's `.env` is where the provider credentials
# live. This stack has none, so nothing a test does can reach a carrier. The image's
# copy of the tree is what runs (`.dockerignore` keeps `.env` out of it), with no bind
# mount and no reloader, so the run tests what was built.
#
# `restart: "no"` throughout: a run killed before its teardown must not come back on the
# next daemon start.

services:
  db:
    restart: "no"
    ports: !reset []

  pgbouncer:
    restart: "no"

  redis:
    restart: "no"

  minio:
    restart: "no"
    ports: !override
      - "127.0.0.1:${E2E_MINIO_PORT:?scripts/e2e.py sets this}:9000"

  app:
    restart: "no"
    env_file: !reset []
    volumes: !reset []
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: !override
      - "127.0.0.1:${E2E_APP_PORT:?scripts/e2e.py sets this}:8000"
    environment:
      API_KEY_SECRET: "${E2E_API_KEY:?scripts/e2e.py sets this}"
      SESSION_SECRET: "${E2E_API_KEY:?scripts/e2e.py sets this}"
