[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = tests
# NOTE: do not set --import-mode=importlib here. scripts/hooks/tests/* rely on
# `from conftest import load_module`, which only resolves under the default
# `prepend` mode (importlib does not put the test dir on sys.path) -- switching
# breaks collection of that suite with 55 ModuleNotFoundError errors.
addopts = --ignore=tests/e2e --ignore=tests/live_e2e --ignore=tests/load --ignore=tests/quarantine -m "not paid"
timeout = 60
timeout_method = thread
markers =
    codex_live: Paid opt-in smoke tests that launch an authenticated Codex CLI session
    slow: Tests that are slow (migration round-trips etc.) -- run with -m slow
    paid: Umbrella for any test that costs money or needs paid live infra -- excluded by default everywhere (addopts -m "not paid"); opt in with -m paid. Every chargeable/sandbox/live_e2e/manual test also carries this.
    chargeable: Paid tier 2 -- incurs small real/sandbox provider charges (buys DIDs, sends SMS). Implies paid.
    sandbox: Paid tier 1 -- requires live sandbox credentials (TELNYX_SANDBOX=1); reads only, near-zero cost. Implies paid.
    live_e2e: Paid tier 3 -- live backend E2E against real infra (RUN_LIVE_E2E=1; costs real money) -- see tests/live_e2e/. Implies paid.
    manual: Live E2E variants needing a human (e.g. answering a click-to-call). Implies paid.
