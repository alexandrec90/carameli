[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = tests
import_mode = importlib
addopts = --ignore=tests/e2e --ignore=tests/live_e2e --ignore=tests/load --ignore=tests/quarantine
timeout = 60
timeout_method = thread
markers =
    slow: Tests that are slow (migration round-trips etc.) -- run with -m slow
    chargeable: Tests that may incur real or sandbox provider charges
    sandbox: Tests that require live sandbox credentials (TELNYX_SANDBOX=1)
    live_e2e: Live backend E2E against real infra (RUN_LIVE_E2E=1; costs money) -- see tests/live_e2e/
    manual: Live E2E variants needing a human (e.g. answering a click-to-call)
