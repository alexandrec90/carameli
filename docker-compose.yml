services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: carameli
      POSTGRES_PASSWORD: carameli_local_dev
      POSTGRES_DB: carameli
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carameli"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: carameli
      DB_PASSWORD: carameli_local_dev
      DB_NAME: carameli
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: plain
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    image: carameli-app
    restart: unless-stopped
    stop_grace_period: 3s
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    # In production remove the host port binding; nginx proxies to app:8000 internally.
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Routes through PgBouncer (transaction pool). Alembic uses DIRECT_DATABASE_URL
      # to bypass PgBouncer for DDL-heavy migrations when needed.
      DATABASE_URL: postgresql+asyncpg://carameli:carameli_local_dev@pgbouncer:5432/carameli
      DIRECT_DATABASE_URL: postgresql+asyncpg://carameli:carameli_local_dev@db:5432/carameli
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health'')"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build: .
    image: carameli-app
    restart: unless-stopped
    stop_grace_period: 3s
    command: arq app.services.call_sync.WorkerSettings
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://carameli:carameli_local_dev@pgbouncer:5432/carameli
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  # nginx — TLS termination and reverse proxy.
  # To enable: fill in your domain and cert paths in nginx.conf, then uncomment this block.
  # nginx:
  #   image: nginx:stable-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/carameli.conf:ro
  #     - /etc/ssl/certs/carameli.crt:/etc/ssl/certs/carameli.crt:ro
  #     - /etc/ssl/private/carameli.key:/etc/ssl/private/carameli.key:ro
  #   depends_on:
  #     - app

  frontend:
    image: node:20-slim
    restart: unless-stopped
    stop_grace_period: 3s
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_PROXY_TARGET=http://app:8000
      # Windows bind mounts don't deliver inotify events to the container, so
      # Vite's watcher needs polling for HMR to work. See frontend/vite.config.ts.
      - CHOKIDAR_USEPOLLING=true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:5173/'',r=>process.exit(r.statusCode>=500?1:0)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # --- Jambonz call engine stack ---

  influxdb:
    image: influxdb:1.8
    restart: unless-stopped
    volumes:
      - influxdata:/var/lib/influxdb
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  jambonz-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: jambonz_root
      MARIADB_DATABASE: jambonz
      MARIADB_USER: jambonz
      MARIADB_PASSWORD: jambonz_local_dev
    volumes:
      - jambonzdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  freeswitch:
    image: drachtio/drachtio-freeswitch-mrf
    restart: unless-stopped
    stop_grace_period: 3s
    ports:
      - "5060:5060/udp"
      - "5061:5061/tcp" # SIP TLS
    environment:
      # TLS: set to "true" to enable SIP TLS on port 5061 + SRTP for media.
      # Mount your certificate and key via the volumes below.
      FREESWITCH_TLS_ENABLE: "${FREESWITCH_TLS_ENABLE:-false}"
      FREESWITCH_TLS_CERT_FILE: /etc/freeswitch/tls/tls.crt
      FREESWITCH_TLS_KEY_FILE: /etc/freeswitch/tls/tls.key
      FREESWITCH_SRTP_ENABLE: "${FREESWITCH_SRTP_ENABLE:-false}"
    volumes:
      # Mount TLS certs from host. Generate with:
      #   openssl req -x509 -newkey rsa:4096 -keyout tls/tls.key \
      #     -out tls/tls.crt -days 365 -nodes -subj "/CN=<your-sip-domain>"
      # Or mount a cert from Let's Encrypt / your CA.
      - ./tls:/etc/freeswitch/tls:ro
    healthcheck:
      # Check that FreeSWITCH ESL (TCP 8021 = 0x1F55) is listening.
      test: ["CMD-SHELL", "grep -q ':1F55' /proc/net/tcp 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  rtpengine:
    image: drachtio/rtpengine
    restart: unless-stopped
    network_mode: host
    # Bypass the image's /entrypoint.sh. That script injects
    # `--config-file /etc/rtpengine.conf`, whose `listen-http=MY_IP:8080` line
    # starts a websocket listener bound to an auto-detected interface. Under
    # Docker Desktop (WSL2 host networking) the autodetect resolves MY_IP to an
    # IPv6 link-local (fe80::...) that libwebsockets cannot bind, which is fatal
    # ("Failed to init websocket listener") and crash-loops the container.
    # Running the binary directly with only the flags below skips that config
    # file, so no websocket listener is ever started.
    entrypoint: ["/usr/local/bin/rtpengine"]
    # RTPENGINE_LOCAL_IP is the local address rtpengine binds RTP sockets to.
    # Default 127.0.0.1 keeps dev working without guessing the WSL VM's (dynamic)
    # IP. For real media relay set it to the host's local IP, optionally with an
    # advertised public IP in `LOCAL!PUBLIC` form (see .env.example).
    # --foreground + --log-stderr are required because we no longer load the
    # config file that set them; without --foreground rtpengine daemonizes and
    # the container's main process exits (restart loop with empty logs).
    command: >
      --interface=${RTPENGINE_LOCAL_IP:-127.0.0.1}
      --listen-ng=127.0.0.1:2223
      --port-min=10000
      --port-max=10100
      --foreground
      --log-stderr
    stop_grace_period: 3s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "grep -q '08AF' /proc/net/udp /proc/net/udp6 2>/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot init container: creates/upgrades the Jambonz MySQL schema.
  # Runs upgrade-jambonz-db.js which is a no-op for any already-applied migration.
  jambonz-db-init:
    image: ghcr.io/jambonz/api-server
    restart: "no"
    working_dir: /opt/app
    command: node db/upgrade-jambonz-db.js
    environment:
      JAMBONES_MYSQL_HOST: jambonz-db
      JAMBONES_MYSQL_PORT: 3306
      JAMBONES_MYSQL_USER: jambonz
      JAMBONES_MYSQL_PASSWORD: jambonz_local_dev
      JAMBONES_MYSQL_DATABASE: jambonz
    depends_on:
      jambonz-db:
        condition: service_healthy

  jambonz:
    image: ghcr.io/jambonz/api-server
    restart: unless-stopped
    stop_grace_period: 3s
    ports:
      - "3000:3000"
    environment:
      JAMBONES_MYSQL_HOST: jambonz-db
      JAMBONES_MYSQL_PORT: 3306
      JAMBONES_MYSQL_USER: jambonz
      JAMBONES_MYSQL_PASSWORD: jambonz_local_dev
      JAMBONES_MYSQL_DATABASE: jambonz
      JAMBONES_REDIS_HOST: redis
      JAMBONES_REDIS_PORT: 6379
      JAMBONES_TIME_SERIES_HOST: influxdb
      DRACHTIO_HOST: freeswitch
      DRACHTIO_PORT: 9022
      HTTP_PORT: 3000
      # Required: used by Jambonz to encrypt credentials stored in MySQL.
      # Override in .env with a 32-char random string for production.
      ENCRYPTION_SECRET: "${ENCRYPTION_SECRET:-carameli-local-dev-encryption-key!}"
      JWT_SECRET: "${JWT_SECRET:-carameli-local-dev-jwt-secret-change-me!}"
      # Call recording — push to the same S3-compatible bucket used by the app.
      # Set S3_* vars in .env; leave blank to disable remote recording storage.
      JAMBONZ_RECORD_ALL_CALLS: "${JAMBONZ_RECORD_ALL_CALLS:-false}"
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      AWS_REGION: "${S3_REGION:-us-east-1}"
      AWS_S3_BUCKET: "${S3_BUCKET:-}"
      # Non-AWS S3 endpoint (e.g. MinIO). Leave blank for real AWS S3.
      AWS_S3_ENDPOINT_URL: "${S3_ENDPOINT:-}"
    depends_on:
      jambonz-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      freeswitch:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:3000/health'',r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # OpenTelemetry Collector — receives Claude Code agent telemetry over OTLP
  # (token cost, tool calls, events) and re-exposes metrics for Prometheus to
  # scrape; events land in logs/telemetry/events.jsonl. Config in
  # otel-collector-config.yaml. Host ports let Claude Code (running on the host)
  # reach it at http://localhost:4318.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.1
    restart: unless-stopped
    profiles: ["monitoring"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
      - ./logs/telemetry:/telemetry
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus scrape endpoint

  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # One-shot: creates the recordings bucket in MinIO if it doesn't exist.
  minio-init:
    image: minio/mc:latest
    restart: "no"
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/carameli-recordings &&
      echo 'Bucket ready'
      "
    depends_on:
      minio:
        condition: service_healthy

volumes:
  pgdata:
  jambonzdata:
  influxdata:
  frontend_node_modules:
  promdata:
  grafanadata:
  miniodata:
