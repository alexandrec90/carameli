services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: voicegateway
      POSTGRES_PASSWORD: voicegateway_local_dev
      POSTGRES_DB: voicegateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicegateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    # In production remove the host port binding; nginx proxies to app:8000 internally.
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://voicegateway:voicegateway_local_dev@db:5432/voicegateway
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  # nginx — TLS termination and reverse proxy.
  # To enable: fill in your domain and cert paths in nginx.conf, then uncomment this block.
  # nginx:
  #   image: nginx:stable-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/carameli.conf:ro
  #     - /etc/ssl/certs/carameli.crt:/etc/ssl/certs/carameli.crt:ro
  #     - /etc/ssl/private/carameli.key:/etc/ssl/private/carameli.key:ro
  #   depends_on:
  #     - app

  frontend:
    image: node:20-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_BASE_URL=http://localhost:8000

volumes:
  pgdata:
