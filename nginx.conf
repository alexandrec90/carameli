# nginx reverse-proxy config for Carameli (VoiceGateway)
#
# BEFORE ENABLING:
#   1. Replace carameli.yourdomain.com with your actual domain.
#   2. Obtain a TLS certificate (e.g. via Let's Encrypt / certbot) and update
#      the ssl_certificate / ssl_certificate_key paths.
#   3. Uncomment the nginx service in docker-compose.yml and remove the
#      host-port binding ("8000:8000") from the app service so the API is
#      only reachable through nginx.
#   4. Set TWILIO_WEBHOOK_BASE_URL=https://carameli.yourdomain.com in .env.
#
# HTTP → HTTPS redirect
server {
    listen 80;
    server_name carameli.yourdomain.com;
    return 301 https://$host$request_uri;
}

# HTTPS reverse proxy
server {
    listen 443 ssl;
    server_name carameli.yourdomain.com;

    ssl_certificate     /etc/ssl/certs/carameli.crt;
    ssl_certificate_key /etc/ssl/private/carameli.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # FastAPI app
    location / {
        proxy_pass         http://app:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
