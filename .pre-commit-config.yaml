fail_fast: true

repos:
  # All hooks use language: system so they share the venv/local binaries
  # with lint-all.ps1 — no version drift between the two scripts.
  - repo: local
    hooks:
      - id: detect-secrets
        name: detect-secrets
        language: system
        entry: detect-secrets-hook --baseline .secrets.baseline
        exclude: (\.secrets\.baseline|\.env\.example)$

      - id: ruff
        name: ruff
        language: system
        entry: ruff check --fix --unsafe-fixes
        types: [python]

      - id: ruff-format
        name: ruff-format
        language: system
        entry: ruff format
        types: [python]

      # dmypy (daemon mode) keeps analysis state across runs — subsequent
      # commits only re-check changed files instead of the whole project.
      - id: mypy
        name: mypy
        language: system
        entry: dmypy run -- app/
        files: ^app/
        types: [python]
        pass_filenames: false

      # Slow / advisory hooks — run on push, not every commit
      - id: vulture
        name: vulture
        language: system
        entry: vulture app/ --min-confidence 80 --ignore-names "cls,ctx,opts"
        files: ^app/
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: pip-audit
        name: pip-audit
        language: system
        entry: pip-audit --ignore-vuln CVE-2026-4539
        files: requirements.*\.txt$
        pass_filenames: false
        stages: [pre-push]

  # .env files — dotenv-linter installed locally (cargo install dotenv-linter)
  - repo: local
    hooks:
      - id: dotenv-linter
        name: dotenv-linter
        language: system
        entry: dotenv-linter check
        files: ^\.env
        types: [file]

  # Frontend — uses the project's own node_modules, reads existing ESLint/stylelint/markdownlint configs
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        language: system
        entry: npm --prefix frontend run lint:eslint -- --fix
        files: ^frontend/src/.*\.[jt]sx?$
        pass_filenames: false

      - id: stylelint
        name: Stylelint
        language: system
        entry: npm --prefix frontend exec -- stylelint --fix
        files: ^frontend/src/.*\.css$

      - id: tsc
        name: TypeScript
        language: system
        entry: npm --prefix frontend run lint:types
        files: ^frontend/src/.*\.[jt]sx?$
        pass_filenames: false
        stages: [pre-push]

      - id: markdownlint
        name: Markdownlint
        language: system
        entry: npm --prefix frontend exec -- markdownlint -c ".markdownlint.json" --fix
        files: \.md$

  # GitHub Actions workflow linter
  - repo: local
    hooks:
      - id: actionlint
        name: actionlint
        language: system
        entry: actionlint
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
