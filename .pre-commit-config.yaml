fail_fast: true

# Local hooks are intentionally minimal — nothing here may be slow. Every lint,
# type, dead-code, and audit check is CI-owned: the PR Gate `lint` job runs
# scripts/lint-all.py (the same entrypoint as the desktop lint task). Merges to
# master are gated by the Dependabot auto-merge workflow, which waits for PR Gate
# to pass before merging (this repo's plan has no branch protection). Run
# `python scripts/lint-all.py` locally only when you want early feedback.
repos:
  - repo: local
    hooks:
      # A generator: regenerates the AGENTS.md/.agents/.codex/hooks.json mirrors
      # from CLAUDE.md/.claude. Generation stays LOCAL (CI must not commit derived
      # files back — it would need write access and hide the diff from review); it
      # modifies files, and the patched git hook auto-stages and retries (see
      # scripts/install-pre-commit.py). CI does not run this hook, but the PR Gate
      # `mirror-sync` job *verifies* its output is in sync, catching a bypassed or
      # uninstalled hook.
      - id: sync-agents
        name: sync CLAUDE -> AGENTS mirrors
        language: system
        entry: python scripts/sync-agents-context.py
        files: (^|/)CLAUDE\.md$|^\.claude/
        pass_filenames: false

      # The one check that must stay local: a secret that reaches the remote
      # is leaked even if CI later goes red.
      - id: detect-secrets
        name: detect-secrets
        language: system
        entry: detect-secrets-hook --baseline .secrets.baseline
        exclude: (\.secrets\.baseline|\.env\.example)$
