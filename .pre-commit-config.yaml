fail_fast: true

# Local hooks are intentionally minimal — nothing here may be slow. Every lint,
# type, dead-code, and audit check is CI-owned: the PR Gate `lint` job runs
# scripts/lint-all.py (the same entrypoint as the desktop lint task). Merges to
# master are gated by the Dependabot auto-merge workflow, which waits for PR Gate
# to pass before merging (this repo's plan has no branch protection). Run
# `python scripts/lint-all.py` locally only when you want early feedback.
repos:
  # --- devkit's published hooks ------------------------------------------------
  # Cheap by design (a TOML parse, an import scan, a byte-compare), so these honour
  # this file's "nothing here may be slow" rule despite not being local.
  #
  # `devkit-drift` is the one that earns its place. `sync-devkit.py --check` resolves
  # its source from $DEVKIT_DIR and exits 0 doing NOTHING when that is unset —
  # indistinguishable from success in a log, which is how the PR gate passed green for
  # months while checking nothing. Through pre-commit there is nothing to configure:
  # pre-commit has already cloned devkit at the rev below, so the version compared
  # against is written down here and moved by `pre-commit autoupdate`. Keep the PR
  # gate's `--check` step too — they fail differently, and the CI one is what survives
  # a bypassed local hook.
  #
  # Keep `rev` in step with `.github/workflows/pr-gate.yml`'s `ref:` and the
  # DEVKIT_VERSION stamp: all three name the upstream revision this repo is vendored
  # from, and a mismatch means the commit-time gate and the CI gate check against
  # different trees.
  - repo: https://github.com/alexandrec90/devkit
    rev: v0.11.15 # a tag, never a branch — one bad upstream commit must not redden this repo
    hooks:
      # Fails on a manifest the harness would otherwise ignore: unparseable TOML (the
      # loader falls back to neutral defaults rather than erroring), a path prefix
      # missing its trailing slash, a directory that does not exist here, or a
      # [db]/[frontend] block switched on and left half-filled.
      - id: devkit-manifest
      # The vendored hook scripts run before the virtualenv exists, so a third-party
      # import there fails at hook time rather than at test time — which no test suite
      # can catch, because the suite runs inside that virtualenv.
      - id: devkit-hooks-stdlib-only
      # Byte-compares every file in sync-devkit.py's MANIFEST against the pinned rev.
      - id: devkit-drift

  - repo: local
    hooks:
      # A generator: refreshes Codex repository skills and hooks from `.claude/`.
      # Generation stays LOCAL (CI must not commit derived
      # files back — it would need write access and hide the diff from review); it
      # modifies files, and the patched git hook auto-stages and retries (see
      # scripts/install-pre-commit.py). CI does not run this hook, but the PR Gate
      # `codex-sync` job *verifies* its output is in sync, catching a bypassed or
      # uninstalled hook.
      - id: sync-codex
        name: sync Codex skills and hooks
        language: system
        entry: python scripts/sync-codex-context.py
        files: ^\.claude/(skills/|settings\.json$)
        pass_filenames: false

  # --- the secret scanner -------------------------------------------------------
  # The one check that must run at commit time rather than in CI: a secret that
  # reaches the remote is leaked even if the PR gate later goes red. Cheap like the
  # devkit hooks above -- an entropy scan of the staged files, not of the tree.
  #
  # Pinned to upstream rather than run as `language: system`, so pre-commit builds the
  # tool its own environment. As a system hook this was the only entry in this file
  # that needed the worktree's `.venv` on PATH, and pre-commit's answer to an
  # executable it cannot find is to fail the hook: a freshly created worktree could
  # not commit at all until it was provisioned, and the symptom read as a broken gate
  # rather than as a missing venv.
  #
  # Keep `rev` in step with the `detect-secrets==` pin in `requirements-dev.txt` and
  # with `.secrets.baseline`'s `version`. `scripts/lint-all.py` scans with the venv's
  # copy and this hook scans with pre-commit's; two versions over one baseline rewrite
  # each other's results, and `test_detect_secrets_channel.py` fails when they part.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0 # a tag, never a branch -- one bad upstream commit must not redden this repo
    hooks:
      - id: detect-secrets
        # Overrides upstream's display name: `scripts/pre-commit.py` maps the name
        # pre-commit prints back to the hook id it re-runs after an auto-fix, and it
        # can only read names written here.
        name: detect-secrets
        args: [--baseline, .secrets.baseline]
        # DEVKIT_FILES.json is the vendoring receipt: a machine-generated map of
        # path -> SHA-256 of each vendored file. Every entry is high-entropy hex by
        # construction and none of it is a secret, so the scanner flags the whole
        # file on every `sync-devkit.py --pull`. Excluded rather than baselined
        # because the hashes change on each pull, which would need a baseline
        # refresh every upgrade -- training everyone to re-baseline on autopilot,
        # which is how a real secret gets waved through.
        exclude: (\.secrets\.baseline|\.env\.example|DEVKIT_FILES\.json)$
