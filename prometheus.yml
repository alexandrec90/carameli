global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: carameli
    static_configs:
      - targets: ["app:8000"]
    metrics_path: /metrics

  # Claude Code agent telemetry, re-exposed by the OTel Collector.
  - job_name: claude-code
    static_configs:
      - targets: ["otel-collector:8889"]
